<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surfboard Tracker</title>
<meta name="theme-color" content="#0b3a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiver">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f4f1ea;
  --surface: #ffffff;
  --ink: #12262d;
  --muted: #5d7279;
  --line: #e2ddd2;
  --brand: #0b3a4a;
  --brand-ink: #ffffff;
  --accent: #0f7f8c;
  --accent-ink: #ffffff;
  --danger: #b3372b;
  --tag: #ece7db;
  --star: #e0a526;
  --radius: 14px;
  --avail: 600px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1a1f;
    --surface: #14272e;
    --ink: #e8f0f1;
    --muted: #93a8ad;
    --line: #223a42;
    --accent: #4fc3cf;
    --accent-ink: #06232a;
    --danger: #ff8a7a;
    --tag: #1d353d;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
header.top {
  position: sticky; top: 0; z-index: 1000;
  background: var(--brand); color: var(--brand-ink);
  padding: calc(env(safe-area-inset-top) + 8px) 8px 8px 16px;
  display: flex; align-items: center; gap: 4px; min-height: 56px;
}
header.top h1 { font-size: 19px; margin: 0; font-weight: 650; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top .back, header.top .hact {
  color: var(--brand-ink); text-decoration: none; font: inherit; font-size: 16px;
  background: none; border: 0; padding: 0 10px; min-height: 44px; min-width: 44px;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px;
}
header.top .back { padding-left: 0; }
header.top .hact.plus { font-size: 28px; font-weight: 300; }
main { padding: 16px 16px calc(env(safe-area-inset-bottom) + 96px); max-width: 720px; margin: 0 auto; }
main.full { padding: 0; max-width: none; }
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
  background: var(--surface); border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs a {
  flex: 1; text-align: center; text-decoration: none; color: var(--muted);
  padding: 8px 0 6px; font-size: 11px; min-height: 52px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
nav.tabs a svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs a.on { color: var(--accent); font-weight: 600; }
h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 4px 8px; font-weight: 600; }
h2.sec:first-child { margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 10px;
  padding: 0 12px 0 16px; min-height: 52px;
  border-bottom: 1px solid var(--line); color: inherit; text-decoration: none;
}
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; padding: 10px 0; }
.row .label { overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: 13px; }
.row .chev { color: var(--muted); font-size: 20px; }
.row.hidden-opt .label { color: var(--muted); text-decoration: line-through; }
.tag { background: var(--tag); color: var(--muted); font-size: 11px; border-radius: 999px; padding: 2px 8px; margin-left: 6px; white-space: nowrap; }
button, .btn {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px;
  min-height: 44px; padding: 0 14px; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.danger { color: var(--danger); }
button.icon { width: 44px; padding: 0; font-size: 16px; color: var(--muted); border-color: transparent; background: transparent; }
button.icon:disabled { opacity: .25; }
button.rowbtn { flex: 1; text-align: left; justify-content: flex-start; border: 0; background: transparent; padding: 10px 0; min-height: 52px; border-radius: 0; flex-wrap: wrap; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], input[type=number], input[type=datetime-local], select, textarea {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px;
  min-height: 44px; padding: 0 12px; width: 100%;
}
input[type=datetime-local] { padding: 8px 12px; }
textarea { padding: 10px 12px; min-height: 96px; resize: vertical; }
.addbar { display: flex; gap: 8px; margin-top: 12px; }
.addbar input { flex: 1; }
.field { margin: 0 0 14px; }
.field > label, .field > .lbl { display: block; font-size: 13px; color: var(--muted); margin: 0 4px 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 10px; }
.empty { text-align: center; color: var(--muted); padding: 48px 20px; }
.empty .big { font-size: 18px; color: var(--ink); font-weight: 600; margin-bottom: 6px; }
.empty .btn { margin-top: 16px; }
.note { color: var(--muted); font-size: 13px; margin: 8px 4px 0; }
.stack { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; }
.actions-row { display: flex; gap: 8px; margin-top: 18px; }
.actions-row > * { flex: 1; }
dialog {
  border: 0; border-radius: 18px; padding: 20px; width: min(92vw, 420px);
  background: var(--surface); color: var(--ink);
}
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h3 { margin: 0 0 12px; font-size: 18px; }
dialog p { margin: 0 0 14px; color: var(--muted); }
dialog .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
dialog.full { width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; border-radius: 0; padding: 0; }
dialog.full[open] { display: flex; flex-direction: column; }
dialog.full .dhead { background: var(--brand); color: var(--brand-ink); padding: calc(env(safe-area-inset-top) + 8px) 8px 8px 16px; display: flex; align-items: center; min-height: 56px; }
dialog.full .dhead h3 { margin: 0; flex: 1; font-size: 18px; }
dialog.full .dhead button { color: var(--brand-ink); background: none; border: 0; }
dialog.full .dbody { flex: 1; position: relative; }
dialog.full .dfoot { padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); border-top: 1px solid var(--line); }
.err { color: var(--danger); font-size: 13px; min-height: 18px; margin: 4px 4px 0; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom) + 76px); z-index: 2000;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px;
  font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center;
}
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

/* toolbar + segmented control */
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--tag); border-radius: 10px; padding: 3px; flex: 1; min-width: 220px; }
.seg button { flex: 1; border: 0; background: transparent; min-height: 38px; border-radius: 8px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.filters select { min-height: 40px; font-size: 14px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); min-height: 44px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

/* tables */
table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
table.list th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.list td { padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.list tr:last-child td { border-bottom: 0; }
table.list tr.click { cursor: pointer; }
table.list tr.click:active { background: var(--tag); }
table.list .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; display: block; background: var(--tag); }
table.list .num { text-align: right; white-space: nowrap; }
table.list .nowrap { white-space: nowrap; }
table.list a { color: inherit; text-decoration: none; display: block; }
.retired { opacity: .55; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; color: inherit; text-decoration: none; display: flex; flex-direction: column; }
.tile .ph { aspect-ratio: 3 / 4; background: var(--tag); position: relative; }
.tile .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .meta { padding: 8px 10px 10px; }
.tile .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.noph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.noph svg { width: 40%; height: 40%; stroke: currentColor; fill: none; stroke-width: 1.2; opacity: .6; }

/* full-page pager */
.pager { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: var(--avail); scrollbar-width: none; overscroll-behavior-x: contain; }
.pager::-webkit-scrollbar { display: none; }
.page { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; height: 100%; display: flex; flex-direction: column; overflow-y: auto; }
.page .ph { flex: 0 0 58%; background: var(--tag); position: relative; }
.page .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.page .body { padding: 14px 18px 18px; max-width: 720px; width: 100%; margin: 0 auto; }
.page .name { font-size: 22px; font-weight: 700; margin: 0; }
.pager-dots { position: absolute; top: 10px; right: 12px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 3px 9px; border-radius: 999px; }
.pagewrap { position: relative; }
.pager-hint { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; }

/* chips + specs */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { background: var(--tag); color: var(--ink); font-size: 13px; border-radius: 999px; padding: 4px 10px; }
dl.specs { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; padding: 14px 16px; font-size: 15px; }
dl.specs dt { color: var(--muted); }
dl.specs dd { margin: 0; }

/* detail */
.hero { margin: -16px -16px 14px; aspect-ratio: 4 / 3; max-height: 55vh; background: var(--tag); position: relative; }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.title-block h2 { margin: 0; font-size: 24px; }
.title-block .sub { font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat .v { font-size: 18px; font-weight: 650; overflow-wrap: anywhere; }
.stat .k { font-size: 12px; color: var(--muted); }
.chartbox { padding: 12px; height: 220px; position: relative; }
.minimap { height: 220px; }
.notes { padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* photo field */
.photo-field { display: flex; gap: 12px; align-items: center; }
.photo-field .prev { width: 84px; height: 112px; border-radius: 10px; background: var(--tag); object-fit: cover; flex: none; position: relative; overflow: hidden; }
.photo-field .prev img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-field .btns { display: flex; flex-direction: column; gap: 8px; flex: 1; }
label.btn input { display: none; }

/* stars */
.stars { display: flex; gap: 4px; }
.stars button { width: 48px; min-height: 48px; padding: 0; font-size: 28px; color: var(--line); border: 0; background: transparent; }
.stars button.on { color: var(--star); }
.fun { color: var(--star); letter-spacing: 1px; white-space: nowrap; }
.fun .off { color: var(--line); }

/* swell box */
.swell { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 0 0 14px; background: var(--surface); }
.swell .h { font-weight: 600; }
.swell .row2 { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.swell .row2 button { min-height: 36px; font-size: 14px; }
.spotpick { display: flex; gap: 8px; }
.spotpick select { flex: 1; }

/* maps */
#bigmap { height: var(--avail); width: 100%; }
.leaflet-container { font: inherit; background: var(--tag); }
.leaflet-container.imagery { background: #1d2a2f; }
.map-legend { position: absolute; z-index: 500; left: 10px; bottom: 26px; right: 10px; background: var(--surface); color: var(--ink); border-radius: 12px; padding: 8px 12px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.18); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.map-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
.leaflet-popup-content { font-size: 14px; line-height: 1.4; margin: 12px 14px; }
.leaflet-popup-content a { color: var(--accent); }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--ink); }
.popup-title { font-weight: 650; font-size: 15px; margin-bottom: 4px; }
.popup-links { display: flex; gap: 12px; margin-top: 8px; }
.pin { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.addspot { display: flex; gap: 8px; margin-top: 8px; }
.rthumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex: none; background: var(--tag); }
.rthumb.noimg { display: flex; align-items: center; justify-content: center; color: var(--muted); }
.rthumb.noimg svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.4; }
.tile .ph.sq, .photo-field .prev.sq { aspect-ratio: 1 / 1; }
.photo-field .prev.sq { height: 84px; }
.picklist { max-height: 55vh; overflow-y: auto; margin: 0 0 8px; }
.pickrow { display: flex; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); min-height: 52px; cursor: pointer; }
.pickrow:last-child { border-bottom: 0; }
.pickrow input { width: 22px; height: 22px; flex: none; accent-color: var(--accent); }
.chipsel { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn { min-height: 40px; border-radius: 999px; font-size: 14px; }
.chipbtn[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
nav.tabs a { font-size: 10.5px; }
.buoy-icon { background: none; border: 0; }
.buoy { position: relative; width: 24px; height: 24px; }
.buoy .bdot { position: absolute; inset: 0; border-radius: 50%; background: #ffc531; border: 2px solid #0b3a4a; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.buoy .bdot svg { width: 16px; height: 16px; fill: #0b3a4a; }
.buoy .blbl { position: absolute; left: 28px; top: 50%; transform: translateY(-50%); white-space: nowrap; background: rgba(11,58,74,.92); color: #fff; font-size: 12px; font-weight: 650; padding: 2px 7px; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.3); pointer-events: none; }
.buoy.stale .bdot { background: #c9d1d3; }
.buoy.stale .blbl { background: rgba(80,95,100,.85); }
table.bt { border-collapse: collapse; margin: 8px 0 4px; font-size: 13px; width: 100%; }
table.bt th { text-align: left; color: var(--muted); font-weight: 500; padding: 2px 10px 2px 0; vertical-align: top; white-space: nowrap; }
table.bt td { padding: 2px 0; }
.spark { color: var(--accent); margin-top: 6px; }
.leaflet-control-layers { border-radius: 10px !important; }
.leaflet-control-layers-toggle { width: 44px !important; height: 44px !important; }
.leaflet-control-layers-expanded { padding: 8px 12px; font-size: 15px; background: var(--surface); color: var(--ink); }
.leaflet-control-layers label { min-height: 36px; display: flex; align-items: center; }
.leaflet-control-layers-selector { width: 18px; height: 18px; margin-right: 6px; accent-color: var(--accent); }
.addspot input { flex: 1; }
</style>
</head>

<header class="top" id="top"></header>
<main id="main"></main>
<nav class="tabs" id="tabs" aria-label="Sections">

</nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>

const APP_ID = 'surfboard-tracker';
const BUILD = 'Build 5.2 (construction list)';

const DB_NAME = 'surfboard-tracker';
const STORES = ['options', 'boards', 'sessions', 'spots', 'photos', 'meta', 'fins', 'finLinks'];

  /* Esri Canvas (light or dark gray) with its label layer on top. No API key needed. */
  map: { label: 'Map', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_{shade}_Gray_Base/MapServer/tile/{z}/{y}/{x}',

    maxNativeZoom: 19, attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics' }
};
const BUOY_URL = 'https://raw.githubusercontent.com/Marcusnaut/Surfboard-Roster/data/buoys.json';
/* NOAA buoys near Ventura. Positions here are a fallback; the data file carries NDBC's current positions. */
const BUOYS = [
  ['46053', 'East Santa Barbara', 34.241, -119.839], ['46217', 'Anacapa Passage', 34.167, -119.435],
  ['46216', 'Goleta Point', 34.334, -119.803], ['46054', 'West Santa Barbara', 34.265, -120.477],
  ['46218', 'Harvest', 34.454, -120.782], ['46025', 'Santa Monica Basin', 33.749, -119.053],
  ['46221', 'Santa Monica Bay', 33.860, -118.641], ['46219', 'San Nicolas Island', 33.221, -119.882]
].map(([id, name, lat, lon]) => ({ id, name, lat, lon }));
const MARINE_URL = 'https://marine-api.open-meteo.com/v1/marine';
const BOARD_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c3 3 4.5 7 4.5 10.5S15 20 12 22c-3-2-4.5-6-4.5-9.5S9 5 12 2z"/><path d="M12 5v14"/></svg>';

/* Each list's key is also the field name on the record that uses it. */
const LISTS = [

/* ---------- photos ---------- */
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { resolve(img); URL.revokeObjectURL(url); };
    img.onerror = () => { reject(new Error("That file couldn't be read as an image.")); URL.revokeObjectURL(url); };
    img.src = url;
  });
}
function scaleTo(img, max, q) {
  const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(resolve => c.toBlob(resolve, 'image/jpeg', q));
}
async function processPhoto(file) {
  const img = await loadImage(file);
  return { blob: await scaleTo(img, 1600, 0.82), thumb: await scaleTo(img, 480, 0.8) };
}

/* ---------- swell ---------- */
const WAVE_IDS = listByKey('waveSize').values.map(v => 'waveSize:' + slug(v));
function addMinutes(localStr, mins) {
  const [d, t] = localStr.split('T');
  const [y, m, dd] = d.split('-').map(Number), [h, mi] = t.split(':').map(Number);
  const u = new Date(Date.UTC(y, m - 1, dd, h, mi + mins));
  return `${u.getUTCFullYear()}-${pad(u.getUTCMonth() + 1)}-${pad(u.getUTCDate())}T${pad(u.getUTCHours())}:${pad(u.getUTCMinutes())}`;
}
async function fetchSwell(spot, start, durationMin) {
  const mid = addMinutes(start, Math.round((durationMin || 0) / 2));
  const date = mid.slice(0, 10), hour = mid.slice(0, 13) + ':00';
  const ahead = (parseLocal(date + 'T00:00') - new Date()) / 86400000;
  if (ahead > 7) throw new Error('That date is too far ahead for a forecast.');
  const params = new URLSearchParams({
    latitude: spot.lat.toFixed(4), longitude: spot.lon.toFixed(4),
    hourly: 'wave_height,wave_period,wave_direction,swell_wave_height,swell_wave_period,swell_wave_direction,wind_wave_height',
    timezone: 'auto', start_date: date, end_date: date, cell_selection: 'sea'
  });
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  let res;
  try { res = await fetch(`${MARINE_URL}?${params}`, { signal: ctrl.signal }); }
  catch (e) { throw new Error(navigator.onLine === false ? "You're offline." : "Couldn't reach the swell service."); }
  finally { clearTimeout(timer); }
  if (!res.ok) {
    let reason = '';
    try { reason = (await res.json()).reason || ''; } catch (e) {}
    throw new Error(/range|date/i.test(reason) ? 'No swell data for that date.' : (reason || `Swell service error (${res.status}).`));
  }
  const j = await res.json();
  const i = (j.hourly && j.hourly.time || []).indexOf(hour);
  if (i < 0) throw new Error('No swell data for that hour.');
  const g = k => { const v = (j.hourly[k] || [])[i]; return v == null ? null : Number(v); };
  const sw = {
    time: hour, lat: j.latitude, lon: j.longitude, fetchedAt: new Date().toISOString(),
    swellH: g('swell_wave_height'), swellP: g('swell_wave_period'), swellDir: g('swell_wave_direction'),
    waveH: g('wave_height'), waveP: g('wave_period'), waveDir: g('wave_direction'), windWaveH: g('wind_wave_height')
  };
  if (sw.swellH == null && sw.waveH == null) throw new Error('No swell data for that spot and time.');
  return sw;
}
/* Rough face-height estimate from open-ocean swell: longer period swells stand up taller at the break. */
function faceFeet(sw) {
  if (!sw) return null;
  const h = sw.swellH ?? sw.waveH, p = sw.swellP ?? sw.waveP;
  if (h == null) return null;
  const k = p == null ? 1.1 : p < 8 ? 0.9 : p < 12 ? 1.2 : p < 15 ? 1.5 : 1.8;
  return h * 3.281 * k;
}
function suggestWaveSize(sw) {
  const ft = faceFeet(sw);
  if (ft == null) return null;
  const limits = [1, 2, 3, 4, 5, 6, 8, 10];
  let idx = limits.findIndex(l => ft < l);
  if (idx < 0) idx = limits.length;
  const id = WAVE_IDS[idx];
  const o = S.options.find(x => x.id === id && !x.hidden);
  return o ? { id, ft } : null;
}

const roundTime = d => { const r = new Date(d); r.setMinutes(Math.floor(r.getMinutes() / 15) * 15, 0, 0); return r; };
function lastOf(field) { const s = [...S.sessions].sort((a, b) => b.start.localeCompare(a.start))[0]; return s ? s[field] : ''; }
const lastBoardId = () => { const id = lastOf('boardId'); const b = boardById(id); return b && !b.retired ? id : ''; };
const lastSpotId = () => lastOf('spotId');
function spotOptions(current) {
  const list = spotsSorted().filter(s => !s.hidden || s.id === current);
  return `<option value="">Choose a spot</option>${list.map(s => `<option value="${esc(s.id)}" ${s.id === current ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}`;
}
function renderStars() {
  $('#stars').innerHTML = [1, 2, 3, 4, 5].map(n => `<button type="button" role="radio" aria-checked="${sform.fun === n}" aria-label="${plural(n, 'star')}" class="${n <= sform.fun ? 'on' : ''}" data-act="fun" data-v="${n}">★</button>`).join('');
}
function scheduleSwell(delay = 500) {
  clearTimeout(sform.timer);
  sform.timer = setTimeout(lookupSwell, delay);
}
async function lookupSwell() {
  const spot = spotById($('#spotId') && $('#spotId').value), start = $('#start') && $('#start').value;
  if (!spot || !start) { sform.swell = null; renderSwell('idle'); return; }
  const token = ++sform.token;
  renderSwell('loading');
  try {
    const sw = await fetchSwell(spot, start, Number($('#duration').value) || 0);
    if (!sform || token !== sform.token || !$('#swellBox')) return;
    sform.swell = sw;
    const sug = suggestWaveSize(sw);
    sform.suggested = sug ? sug.id : null;
    if (sug && !sform.waveTouched && $('#f_waveSize')) $('#f_waveSize').value = sug.id;
    renderSwell('ok');
  } catch (e) {
    if (!sform || token !== sform.token || !$('#swellBox')) return;
    sform.swell = null; sform.suggested = null;
    renderSwell('error', e.message);
  }
}
function renderSwell(state, msg) {
  const box = $('#swellBox');
  if (!box) return;
  sform.state = state;
  if (state === 'idle') box.innerHTML = `<span class="sub">Pick a spot and time to look up the swell.</span>`;
  else if (state === 'none') box.innerHTML = `<span class="sub">No swell data saved for this session.</span><div class="row2"><button type="button" data-act="retrySwell">Look up swell</button></div>`;
  else if (state === 'loading') box.innerHTML = `<span class="sub">Looking up the swell…</span>`;
  else if (state === 'error') box.innerHTML = `<div class="h">No swell data</div><div class="sub">${esc(msg)} Choose a wave size yourself.</div><div class="row2"><button type="button" data-act="retrySwell">Try again</button></div>`;
  else {
    const sw = sform.swell, sug = sform.suggested, sel = $('#f_waveSize'), cur = sel ? sel.value : '';
    const ft = faceFeet(sw);
    box.innerHTML = `<div class="h">Swell ${esc(swellText(sw))}</div>
      ${sw.windWaveH != null ? `<div class="sub">Wind waves ${esc(fmtHeight(sw.windWaveH))} · model data for ${esc(fmtTime(sw.time))}</div>` : ''}
      ${sug ? `<div class="sub">Suggested face height: <strong>${esc(shortSize(sug))}</strong> (about ${ft.toFixed(1)} ft). Adjust if it was different at the spot.</div>` : ''}
      <div class="row2">${sel && sug && cur !== sug ? `<button type="button" data-act="useSuggestion">Use ${esc(shortSize(sug))}</button>` : ''}<button type="button" data-act="retrySwell">Refresh</button></div>`;
  }
}
async function saveSession(form) {
  const fd = new FormData(form);

function spotsMap(el, sessions, { small, showAll } = {}) {
  const map = makeMap(el, small ? { zoomControl: false, scrollWheelZoom: false, layersControl: false } : { buoys: true });
  if (!map) return;
  const bySpot = new Map();
  for (const s of sessions) if (s.spotId) { const g = bySpot.get(s.spotId) || []; g.push(s); bySpot.set(s.spotId, g); }
  const pts = [];
  for (const sp of spotsSorted()) {
    const list = bySpot.get(sp.id) || [];
    if (!list.length && (!showAll || sp.hidden)) continue;
    const a = avg(list.map(s => s.fun).filter(Boolean));
    const m = L.circleMarker([sp.lat, sp.lon], {
      radius: list.length ? Math.min(26, 7 + 4 * Math.sqrt(list.length)) : 5,
      color: '#fff', weight: 2, fillColor: list.length ? funColor(a) : '#8a9a9f', fillOpacity: list.length ? 0.9 : 0.6
    }).addTo(map);
    m.bindPopup(spotSummary(sp, list), { autoPanPaddingTopLeft: [12, 12], autoPanPaddingBottomRight: [12, 110] });
    if (list.length) pts.push([sp.lat, sp.lon]);
  }
  if (pts.length === 1) map.setView(pts[0], 13, { animate: false });
  else if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 13, animate: false });
  return map;
}

function nameError(key, value, exceptId) {
  const v = value.trim();
  if (!v) return 'Enter a name.';
  if (v.length > 60) return 'Keep it under 60 characters.';
  return optionsFor(key).some(o => o.id !== exceptId && o.value.toLowerCase() === v.toLowerCase()) ? 'That value is already in the list.' : '';
}
async function addOption(key, value) {
  const all = optionsFor(key);
  const order = all.length ? Math.max(...all.map(o => o.order)) + 1 : 0;
  await putMany('options', [{ id: key + ':' + newId(), list: key, value: value.trim(), order, builtIn: false, hidden: false }]);
  await loadAll();
}
async function moveOption(id, dir) {
  const o = S.options.find(x => x.id === id);
  const all = optionsFor(o.list);
  const i = all.findIndex(x => x.id === id), j = i + dir;
  if (j < 0 || j >= all.length) return;
  [all[i], all[j]] = [all[j], all[i]];
  all.forEach((x, n) => { x.order = n; });
  await putMany('options', all);
  await loadAll();
}
async function deleteOption(id) {
  const o = S.options.find(x => x.id === id);
  const list = listByKey(o.list);
  const counts = storesOf(list).map(st => [st, S[st].filter(r => r[list.key] === id).length]).filter(([, c]) => c);
  const n = counts.reduce((a, [, c]) => a + c, 0);
  const words = { boards: 'board', sessions: 'session', fins: 'fin set' };
  if (n > 0) {
    openDialog(`<h3>In use</h3><p>"${esc(o.value)}" is used by ${counts.map(([st, c]) => plural(c, words[st])).join(' and ')}, so it can't be deleted. Hide it instead and it stops showing in pickers.</p>
      <div class="actions">${o.hidden ? '' : `<button class="primary" data-act="toggleHide" data-id="${esc(id)}">Hide from pickers</button>`}<button data-act="close">Close</button></div>`);
    return;
  }
  await del('options', id);
  await loadAll();
  closeDialog(); toast('Deleted'); route();
}

/* ---------- backup ---------- */
const blobToDataURL = blob => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve(r.result); r.onerror = () => reject(r.error);
  r.readAsDataURL(blob);
});
const dataURLToBlob = async url => (await fetch(url)).blob();
async function buildBackup() {
  const data = {};
  for (const s of STORES) data[s] = await getAll(s);
  data.photos = await Promise.all(data.photos.map(async p => {
    const out = { ...p };
    if (p.blob instanceof Blob) out.blob = { __blob: await blobToDataURL(p.blob) };
    if (p.thumb instanceof Blob) out.thumb = { __blob: await blobToDataURL(p.thumb) };
    return out;
  }));
  return { app: APP_ID, schema: SCHEMA, exportedAt: new Date().toISOString(), data };
}
async function shareOrDownload(files, title) {
  try {
    if (navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files, title }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  for (const f of files) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  return true;
}
async function exportBackup() {
  const backup = await buildBackup();
  const name = `surfboard-tracker-backup-${backup.exportedAt.slice(0, 10)}.json`;
  const ok = await shareOrDownload([new File([JSON.stringify(backup)], name, { type: 'application/json' })], 'Surfboard Tracker backup');
  if (!ok) return;
  await setMeta('lastBackup', backup.exportedAt); await loadAll();
  toast('Backup exported'); route();
}
function checkBackup(b) {
  if (!b || b.app !== APP_ID || !b.data) return 'This file is not a Surfboard Tracker backup.';
  if (typeof b.schema !== 'number' || b.schema > SCHEMA) return 'This backup comes from a newer version of the app.';
  for (const s of STORES) if (b.data[s] !== undefined && !Array.isArray(b.data[s])) return 'The backup file is damaged.';
  return '';
}
let pendingImport = null;
async function readImport(file) {
  let b;
  try { b = JSON.parse(await file.text()); } catch (e) { b = null; }
  const problem = checkBackup(b);
  if (problem) { openDialog(`<h3>Can't restore</h3><p>${esc(problem)}</p><div class="actions"><button data-act="close">Close</button></div>`); return; }
  pendingImport = b;
  const n = s => (b.data[s] || []).length;
  openDialog(`<h3>Restore this backup?</h3>
    <p>Exported ${esc(new Date(b.exportedAt).toLocaleString())}. It holds ${plural(n('boards'), 'board')}, ${plural(n('sessions'), 'session')}, ${plural(n('photos'), 'photo')} and ${plural(n('options'), 'list value')}.</p>
    <p>Everything currently on this device will be replaced.</p>
    <div class="actions"><button class="primary" data-act="confirmImport">Replace and restore</button><button data-act="close">Cancel</button></div>`);
}
async function applyImport(b) {
  const data = {};
  for (const s of STORES) data[s] = b.data[s] || [];
  data.photos = await Promise.all(data.photos.map(async p => {
    const out = { ...p };
    if (p.blob && p.blob.__blob) out.blob = await dataURLToBlob(p.blob.__blob);
    if (p.thumb && p.thumb.__blob) out.thumb = await dataURLToBlob(p.thumb.__blob);
    return out;
  }));
  await tx(STORES, 'readwrite', t => {
    for (const s of STORES) { const st = t.objectStore(s); st.clear(); data[s].forEach(r => st.put(r)); }
  });
  await seed();
  await loadAll();
}

/* ---------- CSV ---------- */
function csv(rows) {
  return '﻿' + rows.map(r => r.map(v => {
    const s = v == null ? '' : String(v);
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(',')).join('\r\n');
}
async function exportCSV() {
  const boards = [['Model', 'Shaper', 'Length', 'Width (in)', 'Thickness (in)', 'Volume (L)', ...BOARD_LISTS.map(k => listByKey(k).name), 'Retired', 'Sessions', 'Average fun', 'Notes']];
  for (const b of [...S.boards].sort((a, c) => boardName(a).localeCompare(boardName(c)))) {
    const st = statsOf(sessionsFor('boardId', b.id));
    boards.push([b.model, b.shaper, fmtLen(b.length), b.width, b.thickness, b.volume, ...BOARD_LISTS.map(k => optLabel(b[k])), b.retired ? 'Yes' : '', st.count, st.avgFun == null ? '' : st.avgFun.toFixed(2), b.notes]);
  }
  const sessions = [['Date', 'Time', 'Board', 'Spot', 'Latitude', 'Longitude', 'Duration (min)', 'Wave size', 'Wave description', 'Fun', 'Swell height (ft)', 'Swell period (s)', 'Swell direction (deg)', 'Notes']];
  for (const s of [...S.sessions].sort((a, c) => a.start.localeCompare(c.start))) {
    const sp = spotById(s.spotId) || {}, sw = s.swell || {};
    const h = sw.swellH ?? sw.waveH;
    sessions.push([s.start.slice(0, 10), s.start.slice(11, 16), boardFull(boardById(s.boardId)), sp.name, sp.lat, sp.lon, s.duration, optLabel(s.waveSize), optLabel(s.waveDesc), s.fun, h == null ? '' : (h * 3.281).toFixed(1), sw.swellP ?? sw.waveP ?? '', sw.swellDir ?? sw.waveDir ?? '', s.notes]);
  }
  const fins = [['Name', ...FIN_LISTS.map(k => listByKey(k).name), 'Base (in)', 'Depth (in)', 'Area (sq in)', 'Pieces', 'Acquired', 'Paired boards', 'Sessions', 'Average fun', 'Retired', 'Notes']];
  for (const f of [...S.fins].sort((a, c) => finName(a).localeCompare(finName(c)))) {
    const st = statsOf(sessionsWithFin(f.id));
    fins.push([finName(f), ...FIN_LISTS.map(k => optLabel(f[k])), f.base, f.depth, f.area, f.pieces, f.acquired, boardsForFin(f.id).map(boardFull).join('; '), st.count, st.avgFun == null ? '' : st.avgFun.toFixed(2), f.retired ? 'Yes' : '', f.notes]);
  }
  sessions[0].splice(4, 0, 'Fins');
  sessions.slice(1).forEach((r, i) => r.splice(4, 0, ''));
  const sortedS = [...S.sessions].sort((a, c) => a.start.localeCompare(c.start));
  sessions.slice(1).forEach((r, i) => { r[4] = (sortedS[i].finIds || []).map(x => finName(finById(x))).join('; '); });
  const day = new Date().toISOString().slice(0, 10);
  const ok = await shareOrDownload([
    ...(S.fins.length ? [new File([csv(fins)], `fins-${day}.csv`, { type: 'text/csv' })] : []),
    new File([csv(boards)], `surfboards-${day}.csv`, { type: 'text/csv' }),
    new File([csv(sessions)], `surf-sessions-${day}.csv`, { type: 'text/csv' })
  ], 'Surfboard Tracker export');
  if (ok) toast('Spreadsheets exported');
}

let navCount = 0;
function goBack(fallback) {
  if (navCount > 0) history.back(); else location.replace(fallback);
}
function fail(err) { console.error(err); toast('Something went wrong: ' + (err && err.message ? err.message : 'unknown error')); }

document.addEventListener('click', async e => {
  const row = e.target.closest('tr[data-href]');
  if (row && !e.target.closest('a,button')) { location.hash = row.dataset.href; return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  try {
    switch (act) {
      case 'close': closeDialog(); break;
      case 'back': goBack(el.dataset.fallback || '#/boards'); break;
      case 'view': await savePrefs({ boardsView: el.dataset.v }); route(); break;
      case 'edit': editDialog(id); break;
      case 'up': case 'down': {
        await moveOption(id, act === 'up' ? -1 : 1); route();
        const again = document.querySelector(`[data-act="${act}"][data-id="${CSS.escape(id)}"]`);
        if (again && !again.disabled) again.focus();
        break;
      }
      case 'toggleHide': {
        const o = S.options.find(x => x.id === id);
        await putMany('options', [{ ...o, hidden: !o.hidden }]); await loadAll();
        closeDialog(); toast(!o.hidden ? 'Hidden from pickers' : 'Showing in pickers'); route(); break;
      }
      case 'delete': await deleteOption(id); break;
      case 'export': await exportBackup(); break;
      case 'import': $('#importFile').click(); break;
      case 'csv': await exportCSV(); break;
      case 'confirmImport': { const b = pendingImport; pendingImport = null; await applyImport(b); closeDialog(); toast('Backup restored'); route(); break; }
      case 'removePhoto':
        bform.photoBlob = null; bform.thumbBlob = null; bform.removePhoto = true;
        $('#photoPrev').innerHTML = `<div class="noph">${BOARD_ICON}</div>`; el.hidden = true; break;
      case 'deleteBoard': {
        const n = sessionsFor('boardId', id).length;
        if (n) confirmDialog('Delete this board?', `It has ${plural(n, 'session')}. Retire it to keep its history, or delete the board and its sessions.`,
          `<button class="primary" data-act="retireBoard" data-id="${esc(id)}">Retire instead</button><button class="danger" data-act="deleteBoardAll" data-id="${esc(id)}">Delete board and sessions</button>`);
        else confirmDialog('Delete this board?', 'This removes the board and its photo.', `<button class="danger" data-act="deleteBoardAll" data-id="${esc(id)}">Delete board</button>`);
        break;
      }
      case 'deleteBoardAll': await deleteBoard(id, true); break;
      case 'retireBoard': { const b = boardById(id); await putMany('boards', [{ ...b, retired: true }]); await loadAll(); closeDialog(); toast('Board retired'); location.replace(`#/board/${id}`); break; }
      case 'fun': { const n = Number(el.dataset.v); sform.fun = sform.fun === n ? 0 : n; renderStars(); break; }
      case 'pickSpot': openSpotPicker(); break;
      case 'retrySwell': scheduleSwell(0); break;
      case 'useSuggestion': $('#f_waveSize').value = sform.suggested; sform.waveTouched = false; renderSwell('ok'); break;
      case 'deleteSession': confirmDialog('Delete this session?', "This can't be undone.", `<button class="danger" data-act="deleteSessionYes" data-id="${esc(id)}">Delete session</button>`); break;
      case 'deleteSessionYes': await del('sessions', id); await loadAll(); closeDialog(); toast('Session deleted'); goBack('#/sessions'); break;
      case 'toggleSpot': { const sp = spotById(id); await putMany('spots', [{ ...sp, hidden: !sp.hidden }]); await loadAll(); closeDialog(); toast(sp.hidden ? 'Spot shown' : 'Spot hidden'); route(); break; }
      case 'deleteSpot': await deleteSpot(id); break;
      case 'finView': await savePrefs({ finsView: el.dataset.v }); route(); break;
      case 'pairFins': pairDialog('board', id); break;
      case 'pairBoards': pairDialog('fin', id); break;
      case 'toggleSessFin': { if (sform.finIds.has(id)) sform.finIds.delete(id); else sform.finIds.add(id); renderSessionFins(); break; }
      case 'removeFinPhoto':
        fform.photoBlob = null; fform.thumbBlob = null; fform.removePhoto = true;
        $('#photoPrev').innerHTML = `<div class="noph">${FIN_ICON}</div>`; el.hidden = true; break;
      case 'deleteFin': {
        const n = sessionsWithFin(id).length;
        confirmDialog('Delete these fins?', n ? `They're recorded on ${plural(n, 'session')}. Retire them to keep that history, or delete them anyway (the sessions stay, without the fins).` : 'This removes the fins, their photo and their board pairings.',
          `${n ? `<button class="primary" data-act="retireFin" data-id="${esc(id)}">Retire instead</button>` : ''}<button class="danger" data-act="deleteFinYes" data-id="${esc(id)}">Delete fins</button>`);
        break;
      }
      case 'deleteFinYes': await deleteFin(id); break;
      case 'retireFin': { const f = finById(id); await putMany('fins', [{ ...f, retired: true }]); await loadAll(); closeDialog(); toast('Fins retired'); location.replace(`#/fin/${encodeURIComponent(id)}`); break; }
    }
  } catch (err) { fail(err); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  try {
    if (el.dataset.pref) {
      await savePrefs({ [el.dataset.pref]: el.type === 'checkbox' ? el.checked : el.value, ...(el.dataset.pref.startsWith('filter') || el.dataset.pref === 'boardSort' ? { pagerIndex: 0 } : {}) });
      route();
    } else if (el.dataset.listtoggle) {
      const k = el.dataset.listtoggle, off = new Set(prefs.disabledLists || []);
      if (el.checked) off.delete(k); else off.add(k);
      await savePrefs({ disabledLists: [...off], ...(k === 'type' && !el.checked ? { filterType: '' } : {}) });
      toast(el.checked ? 'Field turned on' : 'Field turned off'); route();
    } else if (el.dataset.qfilter) {
      const [path, qs] = location.hash.slice(1).split('?');
      const q = new URLSearchParams(qs || '');
      if (el.value) q.set(el.dataset.qfilter, el.value); else q.delete(el.dataset.qfilter);
      location.replace('#' + path + (q.toString() ? '?' + q : ''));
    }
  } catch (err) { fail(err); }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  const btn = f.querySelector('[type=submit]');
  if (btn) btn.disabled = true;
  try {
    switch (f.dataset.form) {
      case 'add': {
        const input = $('#addValue'), key = f.dataset.key;
        const problem = nameError(key, input.value);
        if (problem) { $('#addErr').textContent = problem; break; }
        await addOption(key, input.value); route(); toast('Added'); $('#addValue').focus(); break;
      }
      case 'rename': {
        const o = S.options.find(x => x.id === f.dataset.id);
        const input = $('#renameValue');
        const problem = nameError(o.list, input.value, o.id);
        if (problem) { $('#renameErr').textContent = problem; break; }
        await putMany('options', [{ ...o, value: input.value.trim() }]); await loadAll();
        closeDialog(); toast('Saved'); route(); break;
      }
      case 'board': await saveBoard(f); break;
      case 'session': await saveSession(f); break;
      case 'spot': await saveSpot(); break;
      case 'fin': await saveFin(f); break;
      case 'pair': {
        const picks = [...f.querySelectorAll('input[name=pick]:checked')].map(i => i.value);
        await setLinks(f.dataset.kind === 'board' ? 'boardId' : 'finId', f.dataset.id, picks);
        await loadAll(); closeDialog(); toast('Pairings saved'); route(); break;
      }
      case 'newSpot': {
        const name = $('#newSpotName').value;
        const problem = spotNameError(name);
        if (problem) { $('#newSpotErr').textContent = problem; break; }
        const sp = await addSpot(name, Number(f.dataset.lat), Number(f.dataset.lon));
        toast('Spot added'); chooseSpot(sp.id); break;
      }
    }
  } catch (err) { fail(err); }
  finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
});
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (file) await readImport(file);
});

/* ---------- router ---------- */
function route() {
  unmount();
  const [path, qs] = (location.hash || '#/boards').slice(2).split('?');
  const parts = path.split('/').map(decodeURIComponent);
  const q = new URLSearchParams(qs || '');
  const tabFor = { boards: 'boards', board: 'boards', fins: 'fins', fin: 'fins', sessions: 'sessions', session: 'sessions', map: 'map', settings: 'settings' };
  const tab = tabFor[parts[0]] || 'boards';
  document.querySelectorAll('#tabs a').forEach(a => {
    const on = a.dataset.tab === tab;
    a.classList.toggle('on', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  switch (parts[0]) {
    case 'board': return parts[2] === 'edit' ? viewBoardForm(parts[1]) : viewBoard(parts[1]);
    case 'boards': return parts[1] === 'new' ? viewBoardForm(null) : viewBoards();
    case 'fins': return parts[1] === 'new' ? viewFinForm(null) : viewFins();
    case 'fin': return parts[2] === 'edit' ? viewFinForm(parts[1]) : viewFin(parts[1]);
    case 'sessions': return parts[1] === 'new' ? viewSessionForm(null, q) : viewSessions(q);
    case 'session': return viewSessionForm(parts[1], q);
    case 'map': return viewMap();
    case 'settings':
      if (parts[1] === 'list') return viewList(parts[2]);
      if (parts[1] === 'spots') return parts[2] === 'new' ? viewSpotForm(null) : viewSpots();
      if (parts[1] === 'spot') return viewSpotForm(parts[2]);
      return viewSettings();
    default: return viewBoards();
  }
}
window.addEventListener('hashchange', () => { navCount++; closeDialog(); route(); window.scrollTo(0, 0); });
let resizeT;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { measure(); mounted.maps.forEach(m => { try { m.invalidateSize(); } catch (e) {} }); }, 150);
});

/* ---------- start ---------- */
(async function start() {
  try {
    db = await openDB();
    await seed();
    await loadAll();
    measure();
    route();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  } catch (err) {
    console.error(err);
    setTop('Surfboard Tracker');
    setMain(`<div class="empty"><div class="big">Storage isn't available</div><div>The app needs on-device storage. Private browsing can block it; open the page in a normal tab.</div></div>`);
  }
})();
</script>
