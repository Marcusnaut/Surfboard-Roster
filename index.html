<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surfboard Tracker</title>
<meta name="theme-color" content="#0b3a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiver">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f4f1ea;
  --surface: #ffffff;
  --ink: #12262d;
  --muted: #5d7279;
  --line: #e2ddd2;
  --brand: #0b3a4a;
  --brand-ink: #ffffff;
  --accent: #0f7f8c;
  --accent-ink: #ffffff;
  --danger: #b3372b;
  --tag: #ece7db;
  --star: #e0a526;
  --radius: 14px;
  --avail: 600px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1a1f;
    --surface: #14272e;
    --ink: #e8f0f1;
    --muted: #93a8ad;
    --line: #223a42;
    --accent: #4fc3cf;
    --accent-ink: #06232a;
    --danger: #ff8a7a;
    --tag: #1d353d;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
/* iPhone home-screen app: with the status bar drawn over the page, iOS sizes short pages one status bar
   too short, which leaves a gap under the tab bar. Making the page that much taller closes it. */
@media (display-mode: standalone) { html { min-height: calc(100% + env(safe-area-inset-top)); } }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
header.top {
  position: sticky; top: 0; z-index: 1000;
  background: var(--brand); color: var(--brand-ink);
  padding: calc(env(safe-area-inset-top) + 8px) 8px 8px 16px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-height: 56px;
}
header.top h1 { font-size: 19px; margin: 0; font-weight: 650; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top .back, header.top .hact {
  color: var(--brand-ink); text-decoration: none; font: inherit; font-size: 16px;
  background: none; border: 0; padding: 0 10px; min-height: 44px; min-width: 44px;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px;
}
header.top .back { padding-left: 0; }
header.top .hact.plus { font-size: 28px; font-weight: 300; }
main { padding: 16px 16px calc(env(safe-area-inset-bottom) + 96px); max-width: 720px; margin: 0 auto; }
main.full { padding: 0; max-width: none; }
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
  background: var(--surface); border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs a {
  flex: 1; text-align: center; text-decoration: none; color: var(--muted);
  padding: 8px 0 6px; font-size: 11px; min-height: 52px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
nav.tabs a svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs a.on { color: var(--accent); font-weight: 600; }
h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 4px 8px; font-weight: 600; }
h2.sec:first-child { margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 10px;
  padding: 0 12px 0 16px; min-height: 52px;
  border-bottom: 1px solid var(--line); color: inherit; text-decoration: none;
}
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; padding: 10px 0; }
.row .label { overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: 13px; }
.row .chev { color: var(--muted); font-size: 20px; }
.row.hidden-opt .label { color: var(--muted); text-decoration: line-through; }
.tag { background: var(--tag); color: var(--muted); font-size: 11px; border-radius: 999px; padding: 2px 8px; margin-left: 6px; white-space: nowrap; }
button, .btn {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px;
  min-height: 44px; padding: 0 14px; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.danger { color: var(--danger); }
button.icon { width: 44px; padding: 0; font-size: 16px; color: var(--muted); border-color: transparent; background: transparent; }
button.icon:disabled { opacity: .25; }
button.rowbtn { flex: 1; text-align: left; justify-content: flex-start; border: 0; background: transparent; padding: 10px 0; min-height: 52px; border-radius: 0; flex-wrap: wrap; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], input[type=search], input[type=number], input[type=datetime-local], input[type=date], input[type=time], input:not([type]), select, textarea {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px;
  min-height: 44px; padding: 0 12px; width: 100%;
}
input[type=datetime-local], input[type=date], input[type=time] { padding: 8px 12px; }
textarea { padding: 10px 12px; min-height: 96px; resize: vertical; }
.addbar { display: flex; gap: 8px; margin-top: 12px; }
.addbar input { flex: 1; }
.field { margin: 0 0 14px; }
.field > label, .field > .lbl { display: block; font-size: 13px; color: var(--muted); margin: 0 4px 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 10px; }
.empty { text-align: center; color: var(--muted); padding: 48px 20px; }
.empty .big { font-size: 18px; color: var(--ink); font-weight: 600; margin-bottom: 6px; }
.empty .btn { margin-top: 16px; }
.note { color: var(--muted); font-size: 13px; margin: 8px 4px 0; }
.stack { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; }
.actions-row { display: flex; gap: 8px; margin-top: 18px; }
.savebar { position: sticky; bottom: calc(env(safe-area-inset-bottom) + 53px); z-index: 900; margin: 18px -16px 0; padding: 10px 16px; background: linear-gradient(to bottom, transparent, var(--bg) 14px); display: flex; }
.savebar button { flex: 1; min-height: 50px; font-size: 17px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
.actions-row > * { flex: 1; }
dialog {
  border: 0; border-radius: 18px; padding: 20px; width: min(92vw, 420px);
  background: var(--surface); color: var(--ink);
}
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h3 { margin: 0 0 12px; font-size: 18px; }
dialog p { margin: 0 0 14px; color: var(--muted); }
dialog .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
dialog.full { width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; border-radius: 0; padding: 0; }
dialog.full[open] { display: flex; flex-direction: column; }
dialog.full .dhead { background: var(--brand); color: var(--brand-ink); padding: calc(env(safe-area-inset-top) + 8px) 8px 8px 16px; display: flex; align-items: center; min-height: 56px; }
dialog.full .dhead h3 { margin: 0; flex: 1; font-size: 18px; }
dialog.full .dhead button { color: var(--brand-ink); background: none; border: 0; }
dialog.full .dbody { flex: 1; position: relative; }
dialog.full .dfoot { padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); border-top: 1px solid var(--line); }
.err { color: var(--danger); font-size: 13px; min-height: 18px; margin: 4px 4px 0; }
#updatebar { position: fixed; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 72px); z-index: 2000; display: flex; align-items: center; gap: 8px;
  background: var(--brand); color: var(--brand-ink); border-radius: 12px; padding: 8px 8px 8px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.3); font-size: 14px; }
#updatebar span { flex: 1; }
#updatebar .ub-x { background: none; border: 0; color: inherit; font-size: 24px; min-width: 40px; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom) + 76px); z-index: 2000;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px;
  font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center;
}
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

/* toolbar + segmented control */
/* View switch in the header (Boards page). */
header.top.seghdr { flex-wrap: wrap; row-gap: 6px; }
header.top .hseg { flex: 1 0 100%; margin: 0 8px 0 0; background: rgba(255,255,255,.14); }
header.top .hseg button { color: var(--brand-ink); opacity: .85; }
header.top .hseg button[aria-pressed=true] { background: var(--brand-ink); color: var(--brand); opacity: 1; }
.seg { display: inline-flex; background: var(--tag); border-radius: 10px; padding: 3px; flex: 1; min-width: 220px; }
.seg button { flex: 1; border: 0; background: transparent; min-height: 38px; border-radius: 8px; font-size: 14px; color: var(--muted); }
.seg a { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 38px; border-radius: 8px; font-size: 14px; text-decoration: none; }
header.top .hseg a { color: var(--brand-ink); opacity: .85; }
header.top .hseg a[aria-pressed=true] { background: var(--brand-ink); color: var(--brand); opacity: 1; font-weight: 600; }
.favbtn { min-height: 40px; min-width: 40px; padding: 0; border: 0; background: none; display: inline-flex; align-items: center; justify-content: center; }
svg.star { width: 24px; height: 24px; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linejoin: round; }
svg.star.on { fill: #e0a526; stroke: #c48d16; }
header.top .favhdr svg.star { stroke: var(--brand-ink); }
header.top .favhdr svg.star.on { fill: #ffc531; stroke: #ffc531; }
.spotfind { width: 100%; margin-bottom: 10px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; min-height: 36px; padding: 0 4px; }
.movebtn { min-width: 44px; min-height: 40px; padding: 0; margin-left: 6px; font-size: 14px; }
.spotrow { flex-wrap: wrap; align-content: flex-start; row-gap: 0; padding-bottom: 12px; }
.spotrow .grow { padding-bottom: 2px; }
.spotrow .olbox { display: block; flex: 0 0 100%; order: 5; margin-top: 6px; }
.spotrow .olbox .outlook { margin: 0; }
.outlook .oc { background: var(--tag); border-radius: 8px; padding: 7px 8px; font: inherit; font-size: 12px; line-height: 1.35; min-width: 0; color: inherit; text-align: left; border: 0; min-height: 0; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; width: 100%; }
.outlook button.oc { cursor: pointer; }
.outlook .ol { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; font-weight: 700; margin-bottom: 4px; }
.outlook .ol .rbadge { font-size: 11px; padding: 0 5px; }
.outlook .oh { font-size: 15px; font-weight: 700; line-height: 1.2; }
.outlook .ov { color: var(--muted); }
.outlook .ov span { white-space: nowrap; }
.outlook { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 4px 0 8px; }
.daystbl { overflow-x: auto; margin-top: 10px; }
.daystbl table { width: 100%; font-size: 13px; }
.daystbl table { border-collapse: separate; border-spacing: 0; }
.daystbl th, .daystbl td { text-align: center; padding: 7px 3px; vertical-align: middle; line-height: 1.25; border: 0; }
.daystbl tr + tr > * { border-top: 1px solid var(--line, rgba(127,127,127,.18)); }
.daystbl tr:nth-child(even) > * { background: var(--zebra, rgba(127,127,127,.09)); }
.daystbl tr > th:first-child { text-align: left; color: var(--muted); font-weight: 600; padding-left: 6px; font-size: 12px; white-space: nowrap; }
.daystbl tr > th:first-child small { display: block; font-weight: 400; font-size: 11px; }
.daystbl td small { display: block; color: var(--muted); font-size: 11px; }
.daystbl td b { font-weight: 650; }
.daystbl tr:first-child > * { background: none; border-top: 0; }
.daystbl th.dh a { display: inline-block; min-width: 40px; padding: 4px 6px; border-radius: 8px; background: var(--tag); color: var(--accent); font-weight: 700; text-decoration: none; }
.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.daynav .btn { min-height: 38px; padding: 0 10px; font-size: 14px; }
.daynav .btn.disabled { opacity: .4; pointer-events: none; }
table.hourly { width: 100%; font-size: 13px; margin-top: 10px; }
table.hourly th, table.hourly td { padding: 6px 4px; text-align: left; vertical-align: middle; line-height: 1.25; }
table.hourly tr + tr > * { border-top: 1px solid var(--line, rgba(127,127,127,.18)); }
table.hourly td small { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; }
table.hourly td b { white-space: nowrap; font-weight: 650; }
.outlook button.oc:active { filter: brightness(.95); }
.rguide { margin: 12px 0; }
.rscale { display: grid; grid-template-columns: repeat(5, 1fr); border-radius: 8px; overflow: hidden; }
.rscale .rs { color: #fff; text-align: center; padding: 4px 2px; font-size: 11px; line-height: 1.25; text-shadow: 0 1px 1px rgba(0,0,0,.3); }
.rscale .rs b { display: block; font-size: 12px; }
.rhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.rinfo { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; min-height: 36px; padding: 0 2px; }
.rexplain { margin-top: 8px; font-size: 14px; }
.rexplain h4 { margin: 6px 0; }
.rguide summary { font-weight: 600; min-height: 36px; display: flex; align-items: center; cursor: pointer; color: var(--accent); }
.rguide ul { padding-left: 20px; margin: 6px 0; }
.rguide li { margin: 4px 0; line-height: 1.4; }
.infobtn { border: 0; background: none; color: inherit; font: inherit; padding: 0 2px; min-height: 28px; text-decoration: underline; text-underline-offset: 2px; }
.linkbtn.small { min-height: 0; padding: 0; font-size: inherit; text-decoration: underline; }
.rbadge { display: inline-block; min-width: 30px; white-space: nowrap; cursor: default; text-align: center; color: #fff; font-weight: 700; font-size: 12px; border-radius: 6px; padding: 1px 5px; text-shadow: 0 1px 1px rgba(0,0,0,.25); }
.spotsmode { min-height: 32px; padding: 2px 28px 2px 8px; font-size: 13px; width: auto; background-color: var(--surface); }
.pulse-icon { background: none; border: 0; }
.pdot { position: absolute; width: var(--sz); height: var(--sz); left: calc(var(--sz) / -2); top: calc(var(--sz) / -2); border-radius: 50%;
  background: var(--pc); opacity: var(--po); border: 2px solid #fff; box-sizing: border-box; transform: scale(var(--pmin));
  animation: dpulse var(--pdur) ease-in-out infinite; will-change: transform; }
@keyframes dpulse { 0%, 100% { transform: scale(var(--pmin)); } 50% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pdot, .leaflet-container.pulsing .buoy .bdot { animation: none !important; transform: none; } }
.leaflet-container.pulsing .buoy .bdot[style*="--pdur"] { animation: bpulse var(--pdur) ease-in-out infinite; }
@keyframes bpulse { 0%, 100% { transform: scale(var(--pmin)); } 50% { transform: scale(var(--pmax)); } }
.pulsedot { background: #1f7fb8; animation: breathe 3s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(.6); } 50% { transform: scale(1.3); } }
.legset { display: inline-flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.filters select { min-height: 40px; font-size: 14px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); min-height: 44px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

/* tables */
table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
table.list th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.list td { padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.list tr:last-child td { border-bottom: 0; }
table.list tr.click { cursor: pointer; }
table.list tr.click:active { background: var(--tag); }
table.list .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; display: block; background: var(--tag); }
table.list .num { text-align: right; white-space: nowrap; }
table.list .nowrap { white-space: nowrap; }
table.list a { color: inherit; text-decoration: none; display: block; }
.retired { opacity: .55; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; color: inherit; text-decoration: none; display: flex; flex-direction: column; }
.tile .ph { aspect-ratio: 3 / 4; background: var(--tag); position: relative; }
.tile .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .meta { padding: 8px 10px 10px; }
.tile .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.noph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.noph svg { width: 40%; height: 40%; stroke: currentColor; fill: none; stroke-width: 1.2; opacity: .6; }

/* full-page pager */
.pager { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: var(--avail); scrollbar-width: none; overscroll-behavior-x: contain; }
.pager::-webkit-scrollbar { display: none; }
.page { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; height: 100%; display: flex; flex-direction: column; overflow-y: auto; }
.page .ph { flex: 0 0 58%; background: var(--tag); position: relative; }
.page .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.page .body { padding: 14px 18px 18px; max-width: 720px; width: 100%; margin: 0 auto; }
.page .name { font-size: 22px; font-weight: 700; margin: 0; }
.pager-dots { position: absolute; top: 10px; right: 12px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 3px 9px; border-radius: 999px; }
.pagewrap { position: relative; }
.pager-hint { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; }

/* chips + specs */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { background: var(--tag); color: var(--ink); font-size: 13px; border-radius: 999px; padding: 4px 10px; }
dl.specs { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; padding: 14px 16px; font-size: 15px; }
dl.specs dt { color: var(--muted); }
dl.specs dd { margin: 0; }

/* detail */
.hero { margin: -16px -16px 14px; aspect-ratio: 4 / 3; max-height: 55vh; background: var(--tag); position: relative; }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.title-block h2 { margin: 0; font-size: 24px; }
.title-block .sub { font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat .v { font-size: 18px; font-weight: 650; overflow-wrap: anywhere; }
.stat .k { font-size: 12px; color: var(--muted); }
.chartbox { padding: 12px; height: 220px; position: relative; }
.minimap { height: 220px; }
.notes { padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* photo field */
.pstrip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; }
.pthumb { position: relative; flex: none; width: 84px; height: 112px; border-radius: 10px; overflow: hidden; background: var(--tag); }
.pthumb.sq { height: 84px; }
.pthumb .pmain { display: block; width: 100%; height: 100%; padding: 0; border: 0; min-height: 0; border-radius: 0; background: none; }
.pthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pthumb.cover { box-shadow: 0 0 0 3px var(--accent); }
.pthumb .pcov { position: absolute; left: 4px; bottom: 4px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 650; padding: 1px 6px; border-radius: 999px; pointer-events: none; }
.pthumb .pdel { position: absolute; top: 3px; right: 3px; width: 28px; height: 28px; min-height: 28px; padding: 0; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 18px; line-height: 1; }
.pthumb.empty .noph { height: 100%; }
.pbtns { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pbtns label.btn input { display: none; }
.hero.gallery .gtrack { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.hero.gallery .gtrack::-webkit-scrollbar { display: none; }

function tx(stores, mode, work) {

/* When spots.json gets a new version (fixed positions, names, label angles), update the built-in spots.
   A spot keeps your own name and position if you changed them in the app; otherwise it takes the file's. */
async function syncSpots(meta) {
  const cur = (meta.find(m => m.key === 'spotsVersion') || {}).value || 1;
  let file = null;
  try { const r = await fetch('spots.json', { cache: 'no-cache' }); if (r.ok) file = await r.json(); } catch (e) { return; }
  if (!file || !Array.isArray(file.spots) || (file.version || 1) <= cur) return;
  const have = new Map((await getAll('spots')).map(x => [x.id, x]));
  const puts = [];
  file.spots.forEach((x, i) => {
    const old = have.get(x.id);
    if (!old) return;
    const base = { name: x.name, lat: x.lat, lon: x.lon };
    const src = old.src || null;
    /* src remembers what the file said last time; if the spot still matches it, you haven't edited it. */
    const ref = src || base;
    const untouched = old.name === ref.name && Math.abs(old.lat - ref.lat) < 1e-6 && Math.abs(old.lon - ref.lon) < 1e-6;
    const extra = { region: x.region, coast: x.coast, ca: !!x.ca, primary: !!x.primary, order: i, builtIn: true, ang: Number.isFinite(x.ang) ? x.ang : null, src: base };
    puts.push(untouched ? { ...old, ...base, ...extra } : { ...old, ...extra });
  });
  if (puts.length) await putMany('spots', puts);
  await setMeta('spotsVersion', file.version || 1);
}
async function seed() {
  const meta = await getAll('meta');
  const done = new Set(meta.filter(m => m.key.startsWith('seeded:')).map(m => m.key.slice(7)));
  for (const l of LISTS) {
    if (done.has(l.key)) continue;
    await putMany('options', l.values.map((v, i) => ({ id: l.key + ':' + slug(v), list: l.key, value: v, order: i, builtIn: true, hidden: false })));
    await setMeta('seeded:' + l.key, true);
  }
  /* Built-in spots come from spots.json (West and East coasts). Existing built-in spots keep the user's
     name, position and hidden state; they only gain region and order. Falls back to the Ventura list offline. */
  if (!done.has('spots2')) {
    let list = null;
    try { const r = await fetch('spots.json', { cache: 'no-cache' }); if (r.ok) list = (await r.json()).spots; } catch (e) {}
    if (Array.isArray(list) && list.length) {
      const have = new Map((await getAll('spots')).map(x => [x.id, x]));
      await putMany('spots', list.map((x, i) => {
        const old = have.get(x.id), extra = { region: x.region, coast: x.coast, ca: !!x.ca, primary: !!x.primary, order: i, builtIn: true };
        return old ? { ...old, ...extra } : { id: x.id, name: x.name, lat: x.lat, lon: x.lon, hidden: false, ...extra, ang: Number.isFinite(x.ang) ? x.ang : null, src: { name: x.name, lat: x.lat, lon: x.lon } };
      }));
      await setMeta('seeded:spots2', true);
      await setMeta('seeded:spots', true);
      done.add('spots');
    }
  }
  await syncSpots(meta);
  if (!done.has('spots')) {
    await putMany('spots', SEED_SPOTS.map(([name, lat, lon], i) => ({ id: 'spot:' + slug(name), name, lat, lon, order: i, builtIn: true, hidden: false, region: 'Ventura', coast: 'West Coast', ca: true })));
    await setMeta('seeded:spots', true);
  }
}

  const groups = new Map();
  for (const s of list) { if (!s[field]) continue; const g = groups.get(s[field]) || []; g.push(s); groups.set(s[field], g); }
  let best = null;
  for (const [id, g] of groups) {
    const a = avg(g.map(s => s.fun).filter(Boolean));
    const score = [a ?? 0, g.length];
    if (!best || score[0] > best.score[0] || (score[0] === best.score[0] && score[1] > best.score[1])) best = { id, score, label: labelFn(id), count: g.length, avg: a };
  }

}

  let best = null;
  for (const [id, c] of counts) if (!best || c > best.count) best = { id, count: c, label: labelFn(id) };
  return best;
}

  /* Pulsing spots are drawn like the buoys: HTML dots with a CSS animation (smooth, handled by the phone's

  const hOn = () => !!hLayer && map.hasLayer(hLayer);
  const rOn = () => map.hasLayer(rLayer) && !hOn(), pOn = () => map.hasLayer(pLayer), anyOn = () => rOn() || pOn() || hOn(), colorOn = () => rOn() || hOn();
  const legend = () => {
    const a = $('#legFun'), b = $('#legRate'), c = $('#legPulse'), d = $('#legHaz');

  };
  const restore = () => { dots.clearLayers(); items.forEach(it => { it.pulse = null; it.m.setStyle(it.orig); }); };
  const when = () => { for (const g of Object.values(map.waveLayers || {})) if (map.hasLayer(g) && g.stepTime()) return Date.parse(g.stepTime()); return Date.now(); };
  const paint = () => {
    if (!anyOn()) return;
    const t = when();
    dots.clearLayers();
    for (const it of items) {
      const sp = spotById(it.id);
      const r = sp && rOn() ? ratingAt(sp, t) : null;
      const z = sp && hOn() ? hazardAt(sp, t) : null;
      const sw = sp && pOn() ? swellAt(sp, t) : null;
      it.rating = r;
      const fill = hOn() ? (z == null ? '#b8c2c6' : hazardInfo(z.twl)[1]) : rOn() ? (r == null ? '#b8c2c6' : ratingInfo(r)[1]) : PULSE_COLOR;

          icon: L.divIcon({ className: 'pulse-icon', iconSize: [0, 0],
            html: `<span class="pdot" style="--sz:${(rMax * 2).toFixed(1)}px;--pmin:0.45;--pdur:${dur.toFixed(2)}s;--pc:${fill};--po:${colorOn() ? 0.95 : 0.7};animation-delay:${pulseDelay(dur)}"></span>` }) }).addTo(dots);
      } else {

        it.m.setStyle(known ? { radius: 7, color: '#fff', weight: 1.5, opacity: 1, fillColor: fill, fillOpacity: 0.95 } : { radius: 4, color: '#fff', weight: 1, opacity: 1, fillColor: '#b8c2c6', fillOpacity: 0.9 });

  const refresh = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      if (!anyOn()) return;

      const inView = items.filter(it => map.hasLayer(it.m) && b.contains(it.m.getLatLng())).map(it => spotById(it.id)).filter(Boolean)
        .sort((a, z) => map.distance(c, [a.lat, a.lon]) - map.distance(c, [z.lat, z.lon])).slice(0, 80);
      paint();
      await loadRatingSeries(inView);
      if (my === token && anyOn()) paint();

  };
  const changed = () => {

    map.getContainer().classList.toggle('pulsing', pOn() && !reducedMotion());
    if (anyOn()) refresh(); else { restore(); if (map.redrawLabels) map.redrawLabels(); }
  };
  [rLayer, pLayer, hLayer].filter(Boolean).forEach(l => { l.on('add', changed); l.on('remove', changed); });
  map.on('moveend spotschange', () => { if (anyOn()) refresh(); });
  map.on('wavestep overlayadd overlayremove', () => { if (anyOn()) paint(); });
}

/* ---------- photos ---------- */
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { resolve(img); URL.revokeObjectURL(url); };
    img.onerror = () => { reject(new Error("That file couldn't be read as an image.")); URL.revokeObjectURL(url); };
    img.src = url;
  });
}
function scaleTo(img, max, q) {
  const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(resolve => c.toBlob(resolve, 'image/jpeg', q));
}
async function processPhoto(file) {
  const img = await loadImage(file);
  return { blob: await scaleTo(img, 1600, 0.82), thumb: await scaleTo(img, 480, 0.8) };
}

  const u = new Date(Date.UTC(y, m - 1, dd, h, mi + mins));

}

    timezone: 'auto', start_date: date, end_date: date, cell_selection: 'sea'

  let res;

  catch (e) { throw new Error(navigator.onLine === false ? "You're offline." : "Couldn't reach the swell service."); }
  finally { clearTimeout(timer); }
  if (!res.ok) {
    let reason = '';
    try { reason = (await res.json()).reason || ''; } catch (e) {}
    throw new Error(/range|date/i.test(reason) ? 'No swell data for that date.' : (reason || `Swell service error (${res.status}).`));

    time: hour, lat: j.latitude, lon: j.longitude, fetchedAt: new Date().toISOString(),

function tideFrom(times, levels, i) {

function filteredBoards() {
  let list = S.boards.filter(b => prefs.showRetired || !b.retired);
  if (prefs.filterType && listOn('type')) list = list.filter(b => b.type === prefs.filterType);
  if (prefs.filterShaper) list = list.filter(b => (b.shaper || '') === prefs.filterShaper);
  const st = new Map(list.map(b => [b.id, statsOf(sessionsFor('boardId', b.id))]));
  const by = {
    model: (a, b) => boardName(a).localeCompare(boardName(b)),
    shaper: (a, b) => (a.shaper || '~').localeCompare(b.shaper || '~') || boardName(a).localeCompare(boardName(b)),
    length: (a, b) => (a.length || 0) - (b.length || 0),
    sessions: (a, b) => st.get(b.id).count - st.get(a.id).count,
    recent: (a, b) => (st.get(b.id).last || '').localeCompare(st.get(a.id).last || ''),
    fun: (a, b) => (st.get(b.id).avgFun ?? -1) - (st.get(a.id).avgFun ?? -1),
    added: (a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')

  return { list: list.sort(by), st };
}

async function applyPhotoEdits(rec, ownerKey) {

    if (p.id) { ids.push(p.id); continue; }
    const id = 'photo:' + newId();
    await putMany('photos', [{ id, [ownerKey]: rec.id, blob: p.blob, thumb: p.thumb }]);

function monthChart(canvas, list) {
  const now = new Date(), labels = [], keys = [];

  }
  makeChart(canvas, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Sessions', data: keys.map(k => list.filter(s => s.start.startsWith(k)).length), backgroundColor: cssVar('--accent'), borderRadius: 6 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
  });
}

async function saveBoard(form) {
  const fd = new FormData(form);
  const model = (fd.get('model') || '').trim(), shaper = (fd.get('shaper') || '').trim();
  if (!model && !shaper) { $('#boardErr').textContent = 'Enter a model or a shaper.'; $('#model').focus(); return; }
  const num = k => { const x = fd.get(k); return x === '' || x == null ? null : Number(x); };
  const existing = bform.id ? boardById(bform.id) : null;
  const b = existing ? { ...existing } : { id: 'board:' + newId(), createdAt: new Date().toISOString() };
  const retired = fd.get('retired') === 'on';
  const reason = retired ? (listOn('retireReason') ? fd.get('retireReason') || '' : existing && existing.retireReason || '') : '';
  Object.assign(b, { model, shaper, length: num('length'), width: num('width'), thickness: num('thickness'), volume: num('volume'), notes: (fd.get('notes') || '').trim(),
    purchasePrice: num('purchasePrice'), retired, retireReason: reason, soldPrice: retired && reason === SOLD ? num('soldPrice') : null,
    retiredAt: retired ? (existing && existing.retired && existing.retiredAt) || new Date().toISOString().slice(0, 10) : null });
  if ((b.purchasePrice != null && (isNaN(b.purchasePrice) || b.purchasePrice < 0)) || (b.soldPrice != null && (isNaN(b.soldPrice) || b.soldPrice < 0))) { $('#boardErr').textContent = 'Prices should be amounts in dollars.'; return; }
  for (const k of boardListsOn()) b[k] = fd.get(k) || '';
  if (b.volume != null && (isNaN(b.volume) || b.volume < 0)) { $('#boardErr').textContent = 'Volume should be a number of liters.'; return; }
  const gone = await applyPhotoEdits(b, 'boardId');
  await putMany('boards', [b]);
  for (const pid of gone) await del('photos', pid);
  await loadAll();
  toast(existing ? 'Board saved' : 'Board added');
  if (existing) goBack(`#/board/${b.id}`); else location.replace(`#/board/${b.id}`);
}
async function deleteBoard(id, withSessions) {
  const b = boardById(id);
  const ss = sessionsFor('boardId', id);
  await tx(['boards', 'sessions', 'photos', 'finLinks'], 'readwrite', t => {
    t.objectStore('boards').delete(id);
    S.finLinks.filter(l => l.boardId === id).forEach(l => t.objectStore('finLinks').delete(l.id));
    if (b) photosOf(b).forEach(pid => t.objectStore('photos').delete(pid));
    if (withSessions) ss.forEach(s => t.objectStore('sessions').delete(s.id));
  });
  await loadAll();
  closeDialog();
  toast('Board deleted');
  location.replace('#/boards');
}

const FIN_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20c0-7 3-13 10-16 1 5 2 11 4 16z"/><path d="M4 20h16"/></svg>';
function finPhoto(f, thumb) {
  const u = photoUrl(f.photoId, thumb);
  return u ? `<img src="${u}" alt="" loading="lazy">` : `<div class="noph">${FIN_ICON}</div>`;

function bestFins(list) {
  const groups = new Map();
  for (const s of list) if (s.fun) for (const fid of s.finIds || []) { if (!finById(fid)) continue; const g = groups.get(fid) || []; g.push(s.fun); groups.set(fid, g); }
  let best = null;
  for (const [fid, funs] of groups) { const a = avg(funs); if (!best || a > best.avg || (a === best.avg && funs.length > best.count)) best = { fin: finById(fid), avg: a, count: funs.length }; }
  return best;
}
function systemMismatch(f, b) { return f.finSystem && b.finSystem && f.finSystem !== b.finSystem; }
function boardFinsHTML(b) {
  const fins = finsForBoard(b.id).sort((a, c) => finName(a).localeCompare(finName(c)));

  }).join('');
  return `<div class="card">${rows || '<div class="stack sub">No fins paired with this board yet.</div>'}
    <div class="stack"><button data-act="pairFins" data-id="${esc(b.id)}">${fins.length ? 'Change paired fins' : 'Pair fins'}</button></div></div>`;
}
function pairDialog(kind, id) {
  /* kind 'board': choose fins for board id. kind 'fin': choose boards for fin id. */
  const isBoard = kind === 'board';
  const current = new Set(isBoard ? finsForBoard(id).map(f => f.id) : boardsForFin(id).map(b => b.id));
  const target = isBoard ? boardById(id) : finById(id);
  const items = (isBoard ? S.fins : S.boards).filter(x => !x.retired || current.has(x.id))
    .sort((a, c) => (isBoard ? finName(a).localeCompare(finName(c)) : boardName(a).localeCompare(boardName(c))));
  if (!items.length) {
    openDialog(`<h3>${isBoard ? 'No fins yet' : 'No boards yet'}</h3><p>${isBoard ? 'Add your fins in the Fins tab, then pair them here.' : 'Add a board first.'}</p>
      <div class="actions">${isBoard ? '<a class="btn primary" href="#/fins/new">Add fins</a>' : ''}<button data-act="close">Close</button></div>`);
    return;
  }
  const rows = items.map(x => {
    const mismatch = isBoard ? systemMismatch(x, target) : systemMismatch(target, x);
    return `<label class="pickrow"><input type="checkbox" name="pick" value="${esc(x.id)}" ${current.has(x.id) ? 'checked' : ''}>
      <span><span class="label">${esc(isBoard ? finName(x) : boardFull(x))}</span><br><span class="sub">${esc(isBoard ? finSub(x) : [fmtLen(x.length), optLabel(x.type)].filter(Boolean).join(' · '))}${mismatch ? ' · different fin system' : ''}</span></span></label>`;
  }).join('');
  openDialog(`<form data-form="pair" data-kind="${kind}" data-id="${esc(id)}">
    <h3>${isBoard ? `Fins for ${esc(boardName(target))}` : `Boards for ${esc(finName(target))}`}</h3>
    <div class="picklist">${rows}</div>
    <div class="actions"><button class="primary" type="submit">Save</button><button type="button" data-act="close">Cancel</button></div></form>`);
}
function filteredFins() {
  let list = S.fins.filter(f => prefs.showRetiredFins || !f.retired);
  if (prefs.filterFinSetup && listOn('finSetup')) list = list.filter(f => f.finSetup === prefs.filterFinSetup);
  const st = new Map(list.map(f => [f.id, statsOf(sessionsWithFin(f.id))]));
  const by = {
    name: (a, b) => finName(a).localeCompare(finName(b)),
    brand: (a, b) => (optLabel(a.finBrand) || '~').localeCompare(optLabel(b.finBrand) || '~') || finName(a).localeCompare(finName(b)),
    boards: (a, b) => boardsForFin(b.id).length - boardsForFin(a.id).length,
    sessions: (a, b) => st.get(b.id).count - st.get(a.id).count,
    fun: (a, b) => (st.get(b.id).avgFun ?? -1) - (st.get(a.id).avgFun ?? -1)
  }[prefs.finSort] || (() => 0);
  return { list: list.sort(by), st };
}

async function saveFin(form) {
  const fd = new FormData(form);
  const name = (fd.get('name') || '').trim();
  const pickedAny = finListsOn().some(k => fd.get(k));
  if (!name && !fd.get('finBrand') && !pickedAny) { $('#finErr').textContent = 'Enter a name or pick at least a brand or configuration.'; $('#finName').focus(); return; }
  const num = k => { const x = fd.get(k); return x === '' || x == null ? null : Number(x); };
  const existing = fform.id ? finById(fform.id) : null;
  const f = existing ? { ...existing } : { id: 'fin:' + newId(), createdAt: new Date().toISOString() };
  Object.assign(f, { name, base: num('base'), depth: num('depth'), area: num('area'), pieces: num('pieces'), acquired: fd.get('acquired') || '', notes: (fd.get('notes') || '').trim(), retired: fd.get('retired') === 'on' });
  for (const k of finListsOn()) f[k] = fd.get(k) || '';
  const gone = await applyPhotoEdits(f, 'finId');
  await putMany('fins', [f]);
  await setLinks('finId', f.id, fd.getAll('boards'));
  for (const pid of gone) await del('photos', pid);
  await loadAll();
  toast(existing ? 'Fins saved' : 'Fins added');
  if (existing) goBack(`#/fin/${encodeURIComponent(f.id)}`); else location.replace(`#/fin/${encodeURIComponent(f.id)}`);
}
async function deleteFin(id) {
  const f = finById(id);
  await tx(['fins', 'finLinks', 'photos', 'sessions'], 'readwrite', t => {
    t.objectStore('fins').delete(id);
    if (f) photosOf(f).forEach(pid => t.objectStore('photos').delete(pid));
    S.finLinks.filter(l => l.finId === id).forEach(l => t.objectStore('finLinks').delete(l.id));
    sessionsWithFin(id).forEach(s => t.objectStore('sessions').put({ ...s, finIds: s.finIds.filter(x => x !== id) }));
  });
  await loadAll();
  closeDialog(); toast('Fins deleted'); location.replace('#/fins');
}

function viewSessions(q) {

  if (!S.sessions.length) {
    setMain(`<div class="empty"><div class="big">No sessions yet</div><div>${S.boards.length ? 'Log a surf to start tracking how each board goes.' : 'Add a board first, then log your surfs against it.'}</div>
      ${S.boards.length ? '<a class="btn primary" href="#/sessions/new">Log a session</a>' : '<a class="btn primary" href="#/boards/new">Add a board</a>'}</div>`);
    return;
  }
  const fb = q.get('board') || '', fs = q.get('spot') || '';
  let list = S.sessions.filter(s => (!fb || s.boardId === fb) && (!fs || s.spotId === fs));
  const sizeIdx = id => WAVE_IDS.indexOf(id);
  const sorter = {
    newest: (a, b) => b.start.localeCompare(a.start), oldest: (a, b) => a.start.localeCompare(b.start),

    const circleHitsRect = (c, b) => { const nx = Math.max(b.x, Math.min(c.x, b.x + b.w)), ny = Math.max(b.y, Math.min(c.y, b.y + b.h)); return (c.x - nx) ** 2 + (c.y - ny) ** 2 < c.r * c.r; };
    const html = [];
    for (const o of live) {
      const w = textWidth(o.it.name) + 8, h = 18, g = o.r + 3;
      const own = { x: o.p.x - o.r - 1, y: o.p.y - o.r - 1, w: 2 * o.r + 2, h: 2 * o.r + 2 };
      const others = blocked.filter(b => b.x !== own.x || b.y !== own.y);
      /* Candidate placements as a direction (unit vector on screen). Spots with a seaward angle get their
         label pointing out to sea, perpendicular to the coast; then level options to the side, above or below. */
      const dirs = [];
      if (Number.isFinite(o.it.ang)) {
        const b = o.it.ang * Math.PI / 180, v = { x: Math.sin(b), y: -Math.cos(b) };
        dirs.push({ v });
      }
      dirs.push({ v: { x: 1, y: 0 } }, { v: { x: -1, y: 0 } }, { v: { x: 0, y: -1 }, up: true }, { v: { x: 0, y: 1 }, up: true });
      /* Last resort for angled spots: point the other way, inland. */
      if (Number.isFinite(o.it.ang)) { const b = o.it.ang * Math.PI / 180; dirs.push({ v: { x: -Math.sin(b), y: Math.cos(b) } }); }
      let chosen = null;
      for (const d of dirs) {
        let circles;
        if (d.up) {
          /* Horizontal text centred above or below the dot. */
          const cy = o.p.y + d.v.y * (g + h / 2);
          circles = [];
          for (let x = -w / 2 + h / 2; x <= w / 2 - h / 2 + 0.1; x += h / 2) circles.push({ x: o.p.x + x, y: cy, r: h / 2 - 1 });
        } else {
          circles = [];
          for (let t = g + h / 2; t <= g + w - h / 2 + 0.1; t += h / 2) circles.push({ x: o.p.x + d.v.x * t, y: o.p.y + d.v.y * t, r: h / 2 - 1 });
        }
        const inView = circles.every(c => c.x - c.r >= 2 && c.y - c.r >= 2 && c.x + c.r <= size.x - 2 && c.y + c.r <= size.y - 2);
        if (!inView) continue;
        if (circles.some(c => placedC.some(q => (c.x - q.x) ** 2 + (c.y - q.y) ** 2 < (c.r + q.r) ** 2))) continue;
        if (circles.some(c => others.some(b => circleHitsRect(c, b)))) continue;
        chosen = { d, circles };
        break;
      }
      if (!chosen) continue;
      placedC.push(...chosen.circles);
      const lp = map.latLngToLayerPoint(o.it.m.getLatLng());
      const { d } = chosen;
      let tf;
      if (d.up) tf = `translate(${Math.round(lp.x - w / 2)}px,${Math.round(lp.y + d.v.y * (g + h / 2) - h / 2)}px)`;
      else {
        /* Keep text upright: if the direction points left, flip it and run the text toward the dot. */
        let a = Math.atan2(d.v.y, d.v.x) * 180 / Math.PI;
        const flip = d.v.x < -1e-6;
        if (flip) a += 180;
        tf = `translate(${Math.round(lp.x)}px,${Math.round(lp.y)}px) rotate(${a.toFixed(1)}deg) translate(${flip ? -(g + w) : g}px,${-h / 2}px)`;
      }
      html.push(`<div class="spotlbl${o.it.rank ? ' surfed' : ''}" style="transform:${tf};width:${w}px">${esc(o.it.name)}</div>`);
    }
    pane.innerHTML = html.join('');
  };
  map.on('zoomstart', () => { pane.style.display = 'none'; });

  map.whenReady(() => setTimeout(draw, 60));

}
/* The map's view lives in the link (#/map?c=lat,lon&z=zoom&b=base&l=layers&spots=all&t=wave hour),

function mapStateFrom(q) {
  const st = {};
  const c = (q.get('c') || '').split(',').map(Number);
  if (c.length === 2 && c.every(Number.isFinite) && Math.abs(c[0]) <= 90 && Math.abs(c[1]) <= 180) st.center = c;
  const z = Number(q.get('z'));
  if (q.has('z') && Number.isFinite(z)) st.zoom = Math.max(2, Math.min(19, Math.round(z)));
  const b = (q.get('b') || '').toLowerCase();
  st.base = Object.keys(BASEMAPS).find(k => BASEMAPS[k].label.toLowerCase() === b || k === b);
  if (q.has('l')) st.overlays = new Set(q.get('l').toLowerCase().split(',').filter(Boolean));
  if (q.has('spots')) st.spotsMode = ['all', 'primary', 'surfed'].includes(q.get('spots')) ? q.get('spots') : 'all';
  if (q.get('t') && !isNaN(Date.parse(q.get('t')))) st.waveTime = new Date(q.get('t')).toISOString();

}
function mapLink(map) {

  const ov = map.overlayLayers || {}, on = [];
  if (ov['Buoys'] && map.hasLayer(ov['Buoys'])) on.push('buoys');
  let grid = null;
  for (const [k, g] of Object.entries(map.waveLayers || {})) if (map.hasLayer(g)) { on.push(k); grid = g; }
  if (map.ratingLayer && map.hasLayer(map.ratingLayer)) on.push('rating');
  if (map.pulseLayer && map.hasLayer(map.pulseLayer)) on.push('pulse');
  if (map.hazardLayer && map.hasLayer(map.hazardLayer)) on.push('hazard');
  p.push(`l=${on.join(',') || 'none'}`, `spots=${map.spotsMode || 'all'}`);

}

const MIN_FUN = 5;      /* rated sessions before "most fun" lists show */

const FUN_POINTS = [0, 1, 3, 6, 10, 15]; /* points per fun star: higher fun counts for much more */
function lockedCard(title, what, have, need) {

function rankList(rows, valFmt, href) {

function groupBy(list, key) {

}
function mostRiddenSpotId() {
  const g = [...groupBy(S.sessions, 'spotId')].filter(([id]) => spotById(id)).sort((a, b) => b[1].length - a[1].length);

/* Similarity between a past session's conditions and now: 1 = same conditions. Missing values count as partly similar. */
function similarity(s, now, spotId) {
  const sw = s.swell, nw = now.swell;
  const part = (a, b, scale) => a == null || b == null ? 0.75 : Math.exp(-(((a - b) / scale) ** 2));
  const ang = (a, b) => { if (a == null || b == null) return 0.75; const d = Math.abs(((a - b + 540) % 360) - 180); return Math.exp(-((d / 35) ** 2)); };
  let w = 1;
  if (!sw || !nw) w *= 0.25;
  else {
    w *= part(sw.swellH ?? sw.waveH, nw.swellH ?? nw.waveH, 0.45);
    w *= part(sw.swellP ?? sw.waveP, nw.swellP ?? nw.waveP, 3);
    w *= ang(sw.swellDir ?? sw.waveDir, nw.swellDir ?? nw.waveDir);
  }
  w *= part(s.tide && s.tide.h, now.tide && now.tide.h, 0.45);
  w *= part(s.weather && s.weather.windSpd, now.weather && now.weather.windSpd, 4);
  if (s.spotId !== spotId) w *= 0.5;
  return w;
}
function recommendBoards(now, spotId) {
  const rated = S.sessions.filter(s => s.fun && boardById(s.boardId) && !boardById(s.boardId).retired);
  const byBoard = groupBy(rated, 'boardId');
  const out = [];
  for (const [bid, list] of byBoard) {
    let wsum = 0, psum = 0, fsum = 0;
    for (const s of list) { const w = similarity(s, now, spotId); wsum += w; psum += w * FUN_POINTS[s.fun]; fsum += w * s.fun; }
    /* Shrink toward zero when there's little matching history, so one lucky session doesn't win. */
    const score = psum / (wsum + 0.75);
    out.push({ board: boardById(bid), score, pct: Math.round(score / FUN_POINTS[5] * 100), similar: wsum, expFun: wsum ? fsum / wsum : null, n: list.length });

async function moveOption(id, dir) {
  const o = S.options.find(x => x.id === id);
  const all = optionsFor(o.list);
  const i = all.findIndex(x => x.id === id), j = i + dir;
  if (j < 0 || j >= all.length) return;
  [all[i], all[j]] = [all[j], all[i]];
  all.forEach((x, n) => { x.order = n; });
  await putMany('options', all);
  await loadAll();
}

/* ---------- backup ---------- */
const blobToDataURL = blob => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve(r.result); r.onerror = () => reject(r.error);
  r.readAsDataURL(blob);
});
const dataURLToBlob = async url => (await fetch(url)).blob();
async function buildBackup() {
  const data = {};
  for (const s of STORES) data[s] = await getAll(s);
  data.photos = await Promise.all(data.photos.map(async p => {
    const out = { ...p };
    if (p.blob instanceof Blob) out.blob = { __blob: await blobToDataURL(p.blob) };
    if (p.thumb instanceof Blob) out.thumb = { __blob: await blobToDataURL(p.thumb) };
    return out;
  }));
  return { app: APP_ID, schema: SCHEMA, exportedAt: new Date().toISOString(), data };
}
async function shareOrDownload(files, title) {
  try {
    if (navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files, title }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  for (const f of files) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  return true;
}
async function exportBackup() {
  const backup = await buildBackup();
  const name = `surfboard-tracker-backup-${backup.exportedAt.slice(0, 10)}.json`;
  const ok = await shareOrDownload([new File([JSON.stringify(backup)], name, { type: 'application/json' })], 'Surfboard Tracker backup');
  if (!ok) return;
  await setMeta('lastBackup', backup.exportedAt); await loadAll();
  toast('Backup exported'); route();
}
function checkBackup(b) {
  if (!b || b.app !== APP_ID || !b.data) return 'This file is not a Surfboard Tracker backup.';
  if (typeof b.schema !== 'number' || b.schema > SCHEMA) return 'This backup comes from a newer version of the app.';
  for (const s of STORES) if (b.data[s] !== undefined && !Array.isArray(b.data[s])) return 'The backup file is damaged.';
  return '';
}
let pendingImport = null;
async function readImport(file) {
  let b;
  try { b = JSON.parse(await file.text()); } catch (e) { b = null; }
  const problem = checkBackup(b);
  if (problem) { openDialog(`<h3>Can't restore</h3><p>${esc(problem)}</p><div class="actions"><button data-act="close">Close</button></div>`); return; }
  pendingImport = b;
  const n = s => (b.data[s] || []).length;
  openDialog(`<h3>Restore this backup?</h3>
    <p>Exported ${esc(new Date(b.exportedAt).toLocaleString())}. It holds ${plural(n('boards'), 'board')}, ${plural(n('sessions'), 'session')}, ${plural(n('photos'), 'photo')} and ${plural(n('options'), 'list value')}.</p>
    <p>Everything currently on this device will be replaced.</p>
    <div class="actions"><button class="primary" data-act="confirmImport">Replace and restore</button><button data-act="close">Cancel</button></div>`);
}
async function applyImport(b) {
  const data = {};
  for (const s of STORES) data[s] = b.data[s] || [];
  data.photos = await Promise.all(data.photos.map(async p => {
    const out = { ...p };
    if (p.blob && p.blob.__blob) out.blob = await dataURLToBlob(p.blob.__blob);
    if (p.thumb && p.thumb.__blob) out.thumb = await dataURLToBlob(p.thumb.__blob);
    return out;
  }));
  await tx(STORES, 'readwrite', t => {
    for (const s of STORES) { const st = t.objectStore(s); st.clear(); data[s].forEach(r => st.put(r)); }
  });
  await seed();
  await loadAll();
}

    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  switch (parts[0]) {
    case 'board': return parts[2] === 'edit' ? viewBoardForm(parts[1]) : viewBoard(parts[1]);
    case 'boards': return parts[1] === 'new' ? viewBoardForm(null) : viewBoards();
    case 'fins': return parts[1] === 'new' ? viewFinForm(null) : viewFins();
    case 'fin': return parts[2] === 'edit' ? viewFinForm(parts[1]) : viewFin(parts[1]);
    case 'sessions': return parts[1] === 'new' ? viewSessionForm(null, q) : viewSessions(q);
    case 'session': return viewSessionForm(parts[1], q);
    case 'map': return viewMap(q);
    case 'stats': return viewStats();
    case 'spots': return viewSpotsTab();
    case 'spot': return parts[2] === 'day' ? viewSpotDay(parts[1], parts[3]) : viewSpotPage(parts[1]);
    case 'settings':
      if (parts[1] === 'help') return viewHelp();
      if (parts[1] === 'list') return viewList(parts[2]);
      if (parts[1] === 'spots') return parts[2] === 'new' ? viewSpotForm(null) : viewSpots();
      if (parts[1] === 'spot') return viewSpotForm(parts[2]);
      return viewSettings();
    default: return viewBoards();
  }
}
window.addEventListener('hashchange', () => { navCount++; closeDialog(); route(); window.scrollTo(0, 0); });
window.addEventListener('resize', () => refit());
/* iOS can settle the home-screen layout a moment after launch, rotation or the keyboard closing. */
['pageshow', 'orientationchange'].forEach(ev => window.addEventListener(ev, () => refit(300)));
document.addEventListener('focusout', () => setTimeout(healViewport, 160));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  checkForUpdate();
  setTimeout(() => { healViewport(); refit(0); }, 300);
});

/* ---------- start ---------- */
(async function start() {
  try {
    db = await openDB();
    await seed();
    await loadAll();
    measure();
    route();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
    checkForUpdate();
    if (new URLSearchParams(location.search).has('v')) history.replaceState(null, '', location.pathname + location.hash);
  } catch (err) {
    console.error(err);
    setTop('Surfboard Tracker');
    setMain(`<div class="empty"><div class="big">Storage isn't available</div><div>The app needs on-device storage. Private browsing can block it; open the page in a normal tab.</div></div>`);
  }
})();
</script>
