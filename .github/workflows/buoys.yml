# Fetches the latest NOAA buoy readings for the US West and East coasts every 30 minutes and
# CDIP 5-day forecasts for California buoys and spots (refreshed every ~6 hours), and publishes
# them as buoys.json and forecasts.json on the `data` branch, which the app reads, plus
# wavegrid.json: the hours available in CDIP's California wave-height map layer, and
# spotseries.json: model swell, wind and tide for every spot (Open-Meteo), for the map's ratings, and
# storms/*: GFS pressure and wind over the Pacific for the Storms layer, and
# wind/*.json: wind forecast grids for the map's wind layers (HRRR, GFS from NOAA; ECMWF via Open-Meteo).
# GitHub may run scheduled jobs a few minutes late, and pauses them if the repository
# has no activity for 60 days (re-enable under Actions if that happens).
name: Update buoy data

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force_forecasts:
        description: "Refresh CDIP forecasts now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: buoys
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch buoys
        run: |
          mkdir -p out
          python3 tools/fetch_buoys.py out/buoys.json
      - name: Fetch forecasts
        env:
          REPO: ${{ github.repository }}
          FORCE_FORECASTS: ${{ inputs.force_forecasts && '1' || '' }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${REPO}/data/forecasts.json" -o prev_forecasts.json || true
          python3 tools/fetch_forecasts.py out/buoys.json spots.json out/forecasts.json prev_forecasts.json || cp prev_forecasts.json out/forecasts.json || true
      - name: List CDIP wave-height grid times
        env:
          REPO: ${{ github.repository }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${REPO}/data/wavegrid.json" -o prev_wavegrid.json || true
          python3 tools/fetch_wave_grid.py out/wavegrid.json prev_wavegrid.json || cp prev_wavegrid.json out/wavegrid.json || true
      - name: Model swell, wind and tide for all spots (refreshed every ~6 hours)
        env:
          REPO: ${{ github.repository }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${REPO}/data/spotseries.json" -o prev_spotseries.json || true
          python3 tools/fetch_spot_series.py spots.json out/spotseries.json prev_spotseries.json || cp prev_spotseries.json out/spotseries.json || true
      - name: Wind forecast grids (HRRR, GFS, ECMWF over the home area; refreshed every ~2.5 hours)
        env:
          REPO: ${{ github.repository }}
        run: |
          pip install -q pygrib numpy || true
          mkdir -p prev_wind/wind
          for m in hrrr gfs ecmwf; do curl -fsSL "https://raw.githubusercontent.com/${REPO}/data/wind/$m.json" -o prev_wind/wind/$m.json || rm -f prev_wind/wind/$m.json; done
          python3 tools/fetch_wind.py out prev_wind || cp -r prev_wind/wind out/ || true
      - name: Storm tracking grids (GFS pressure and wind over the Pacific; refreshed every ~6 hours)
        env:
          REPO: ${{ github.repository }}
        run: |
          mkdir -p prev_storms/storms
          if curl -fsSL "https://raw.githubusercontent.com/${REPO}/data/storms/index.json" -o prev_storms/storms/index.json; then
            for f in $(python3 -c "import json;print(' '.join(json.load(open('prev_storms/storms/index.json'))['files']))"); do curl -fsSL "https://raw.githubusercontent.com/${REPO}/data/storms/$f" -o prev_storms/storms/$f || true; done
          fi
          python3 tools/fetch_storms.py out prev_storms || cp -r prev_storms/storms out/ || true
      - name: Publish to the data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Buoy data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" data
