# Temporary: checks the USGS imagery services. Remove after use.
name: Service probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for n in USGSImageryTopo USGSImageryOnly; do
            curl -s -m 40 -o i.png -w "$n %{http_code} %{content_type} %{size_download}\n" "https://basemap.nationalmap.gov/arcgis/services/$n/MapServer/WMSServer?service=WMS&request=GetMap&version=1.3.0&layers=0&styles=&format=image/png&transparent=false&crs=EPSG:3857&bbox=-13286590.0,4050551.0,-13267022.1,4070118.9&width=256&height=256"
          done
