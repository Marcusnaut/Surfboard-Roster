# Temporary: reads the GIBS sea surface temperature colors. Remove after use.
name: Service probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -s https://gibs.earthdata.nasa.gov/colormaps/v1.3/GHRSST_Sea_Surface_Temperature.xml -o cm.xml
          curl -s -D - -o /dev/null -H "Origin: https://marcusnaut.github.io" https://gibs.earthdata.nasa.gov/colormaps/v1.3/GHRSST_Sea_Surface_Temperature.xml | grep -i "access-control" || echo "no CORS header"
          python3 -c "
          import re
          s=open('cm.xml').read()
          e=re.findall(r'rgb=\"(\d+),(\d+),(\d+)\"[^>]*value=\"\[([-\d.INF]+),([-\d.INF]+)\)\"', s)
          print('entries', len(e), e[1][3:], e[-1][3:])
          for t in range(4, 31, 1):
              for r,g,b,lo,hi in e:
                  try:
                      if float(lo) <= t < float(hi): print('C', t, '#%02x%02x%02x' % (int(r),int(g),int(b))); break
                  except ValueError: pass
          "
