# Temporary: trial run of the wind data job. Remove after use.
name: Service probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pygrib numpy
      - run: mkdir out && time python3 tools/fetch_wind.py out
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd out && ls -la wind && git init -q -b probe-samples && git config user.name bot && git config user.email bot@example.com && git add -A && git commit -qm wind && git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" probe-samples
