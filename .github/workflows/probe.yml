# Temporary: looks for wind forecast map services. Remove after use.
name: Service probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          curl -s -m 60 "https://mapservices.weather.noaa.gov/raster/rest/services/NDFD?f=json" | head -c 2000; echo
          curl -s -m 60 "https://nowcoast.noaa.gov/geoserver/wms?service=WMS&request=GetCapabilities&version=1.3.0" -o c.xml
          python3 -c "
          import re; s=open('c.xml', errors='replace').read()
          names=re.findall(r'<Name>([^<]+)</Name>', s); print('ALL', [n for n in names if ':' in n][:120])"
