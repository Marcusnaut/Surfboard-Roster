# Temporary: checks a place-name tile. Remove after use.
name: Service probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for L in 4 3,4; do curl -s -m 40 -o n.png -w "show:$L %{http_code} %{content_type} %{size_download}\n" "https://carto.nationalmap.gov/arcgis/rest/services/govunits/MapServer/export?bbox=-13286590.0,4050551.0,-13267022.1,4070118.9&bboxSR=3857&imageSR=3857&size=512,512&dpi=192&format=png32&transparent=true&layers=show:$L&f=image"; done
          curl -s -m 40 -o e.png -w "empty-area %{size_download}\n" "https://carto.nationalmap.gov/arcgis/rest/services/govunits/MapServer/export?bbox=-13400000,3900000,-13380000,3920000&bboxSR=3857&imageSR=3857&size=512,512&dpi=192&format=png32&transparent=true&layers=show:4&f=image"
