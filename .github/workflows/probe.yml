# Temporary: looks for The National Map place-name services. Remove after use.
name: Service probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          set +e
          for svc in geonames govunits; do
            echo "== $svc"; curl -s -m 40 "https://carto.nationalmap.gov/arcgis/services/$svc/MapServer/WMSServer?service=WMS&request=GetCapabilities&version=1.3.0" -o c.xml -w "%{http_code} %{size_download}\n"
            python3 -c "
          import re; s=open('c.xml').read()
          print(re.findall(r'<Name>([^<]+)</Name>\s*<Title>([^<]+)</Title>', s)[:40])
          print('fees', re.findall(r'<Fees>([^<]*)</Fees>', s), 'access', re.findall(r'<AccessConstraints>([^<]*)</AccessConstraints>', s), '3857' in s)
          "
          done
          echo "== basemap list"; curl -s -m 30 "https://basemap.nationalmap.gov/arcgis/rest/services?f=json" | head -c 1200; echo
