name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q pygrib numpy
          mkdir -p o s
          time python3 tools/fetch_storms.py o
          ls -la o/storms | head; du -sh o/storms
          python3 -c "import json;d=json.load(open('o/storms/index.json'));print({k:(v if not isinstance(v,(list,str)) or len(v)<80 else len(v)) for k,v in d.items()})"
          gzip -c o/storms/f024.json | wc -c
          cp o/storms/index.json o/storms/f024.json s/
          W='https://pae-paha.pacioos.hawaii.edu/thredds/wms/ww3_global/WaveWatch_III_Global_Wave_Model_best.ncd'
          for pal in rainbow occam ncview jet; do
            curl -sS -m 60 "$W?service=WMS&version=1.1.1&request=GetMap&layers=shgt&styles=boxfill/$pal&srs=EPSG:3857&bbox=-26000000,0,-10000000,10000000&width=512&height=320&format=image/png&transparent=true&colorscalerange=0,6&numcolorbands=60&abovemaxcolor=extend" -o s/shgt_$pal.png
            curl -sS -m 60 "$W?service=WMS&version=1.1.1&request=GetMap&layers=sper&styles=boxfill/$pal&srs=EPSG:3857&bbox=-26000000,0,-10000000,10000000&width=512&height=320&format=image/png&transparent=true&colorscalerange=5,22&numcolorbands=60&abovemaxcolor=extend" -o s/sper_$pal.png
          done
          D=$(date -u +%Y-%m-%d)
          curl -sS -m 60 "$W?request=GetMetadata&item=timesteps&layerName=shgt&day=$D" -o s/ts_today.json; head -c 400 s/ts_today.json; echo
          for k in 3 5 6 7 8; do D2=$(date -u -d "+$k day" +%Y-%m-%d); echo $D2; curl -sS -m 60 "$W?request=GetMetadata&item=timesteps&layerName=shgt&day=$D2" | head -c 300; echo; done
          curl -sS -m 60 "$W?request=GetMetadata&item=layerDetails&layerName=shgt" -o s/ld.json; python3 -c "import json;d=json.load(open('s/ld.json'));print({k:v for k,v in d.items() if k!='datesWithData'}); y=max(d['datesWithData']); m=max(d['datesWithData'][y],key=int); print(y,m,d['datesWithData'][y][m][-5:])"
          curl -sS -m 60 "$W?request=GetMetadata&item=layerDetails&layerName=sper" | head -c 300; echo
          curl -sS -m 60 -o s/leg.png "$W?REQUEST=GetLegendGraphic&LAYER=shgt&PALETTE=rainbow&COLORSCALERANGE=0,6&NUMCOLORBANDS=60&COLORBARONLY=true&VERTICAL=false&WIDTH=220&HEIGHT=14"; file s/leg.png
          cd s && git init -q -b probe-samples && git add -A && git -c user.name=p -c user.email=p@p commit -qm samples && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-samples
    permissions: { contents: write }
