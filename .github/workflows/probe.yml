# Temporary: is NAM still published? Remove after use.
name: Service probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set +e
          echo "== nam prod"; curl -s -m 40 https://nomads.ncep.noaa.gov/pub/data/nccf/com/nam/prod/ | grep -o 'href="[^"]*"' | tail -5
          D=$(date -u +%Y%m%d)
          echo "== nam today"; curl -s -m 40 https://nomads.ncep.noaa.gov/pub/data/nccf/com/nam/prod/nam.$D/ | grep -o 'conusnest[^"<]*' | sort -u | tail -5
          echo "== rrfs"; curl -s -m 40 https://nomads.ncep.noaa.gov/pub/data/nccf/com/rrfs/ | grep -o 'href="[^"]*"' | head; curl -s -m 40 https://nomads.ncep.noaa.gov/pub/data/nccf/com/rrfs/prod/ | grep -o 'href="[^"]*"' | tail -3
          echo "== filters"; curl -s -m 40 https://nomads.ncep.noaa.gov/ | grep -io 'filter_[a-z0-9_]*\.pl' | sort -u | grep -i 'nam\|rrfs\|hrrr'
