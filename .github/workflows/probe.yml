# Temporary: checks the outside services the map uses. Remove after use.
name: Service probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "== marine multi"; curl -s -o /tmp/m.json -w "%{http_code}\n" "https://marine-api.open-meteo.com/v1/marine?latitude=34.27,34.28&longitude=-119.30,-119.27&hourly=swell_wave_height,swell_wave_period,swell_wave_direction,wave_height,wave_period,wave_direction,sea_level_height_msl&forecast_days=6&timezone=GMT&cell_selection=sea"; head -c 400 /tmp/m.json; echo
          echo "== weather multi"; curl -s -o /tmp/w.json -w "%{http_code}\n" "https://api.open-meteo.com/v1/forecast?latitude=34.27,34.28&longitude=-119.30,-119.27&hourly=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms&forecast_days=6&timezone=GMT"; head -c 400 /tmp/w.json; echo
          B="https://thredds.cdip.ucsd.edu/thredds/wms/cdip/model/MOP_grids/CA_0.01_nowcast.nc?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=waveHs&STYLES=raster/cdip&FORMAT=image/png&TRANSPARENT=true&CRS=EPSG:3857&WIDTH=256&HEIGHT=256&BBOX=-13306157,4031474,-13286589,4051042&COLORSCALERANGE=0,6.096"
          echo "== cdip no time"; curl -s -o /tmp/a.png -w "%{http_code} %{content_type} %{size_download}\n" "$B"; head -c 300 /tmp/a.png | strings | head -3
          echo "== cdip 06Z"; curl -s -o /tmp/b.png -w "%{http_code} %{content_type} %{size_download}\n" "$B&TIME=2026-11-16T06:00:00.000Z"; head -c 300 /tmp/b.png | strings | head -3
          echo "== cdip caps"; curl -s "https://thredds.cdip.ucsd.edu/thredds/wms/cdip/model/MOP_grids/CA_0.01_nowcast.nc?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetCapabilities" | grep -o '<Dimension name="time"[^<]*' | head -2 | cut -c1-400
