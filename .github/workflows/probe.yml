# Temporary: imagery tile samples. Remove after use.
name: Service probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          mkdir out
          while read z x y; do
            curl -s -m 30 -o out/usgs_${z}_${x}_${y}.jpg "https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/$z/$y/$x"
            curl -s -m 30 -o out/wms_${z}_${x}_${y}.png "https://basemap.nationalmap.gov/arcgis/services/USGSImageryOnly/MapServer/WMSServer?service=WMS&request=GetMap&version=1.3.0&layers=0&styles=&format=image/png&crs=EPSG:3857&width=256&height=256&bbox=$(python3 -c "
          import math; z,x,y=$z,$x,$y; R=6378137; o=math.pi*R; r=2*o/(256*2**z); print(f'{x*256*r-o},{o-(y+1)*256*r},{(x+1)*256*r-o},{o-y*256*r}')")"
            curl -s -m 30 -o out/eox_${z}_${x}_${y}.jpg "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2023_3857/default/GoogleMapsCompatible/$z/$y/$x.jpg"
          done <<'T'
          10 172 408
          12 690 1632
          13 1381 3264
          14 2762 6529
          16 11050 26119
          10 172 408
          12 691 1633
          13 1382 3266
          14 2764 6533
          16 11059 26135
          T
          ls -la out
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd out && git init -q -b probe-samples && git config user.name bot && git config user.email bot@example.com && git add -A && git commit -qm samples && git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" probe-samples
