# Temporary: builds places.json once. Remove after use.
name: Service probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: mkdir out && python3 tools/build_places.py spots.json out/places.json
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd out && git init -q -b probe-samples && git config user.name bot && git config user.email bot@example.com && git add -A && git commit -qm places && git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" probe-samples
