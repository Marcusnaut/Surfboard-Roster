# Temporary: checks sea surface temperature sources. Remove after use.
name: Service probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          set +e
          curl -s "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/1.0.0/WMTSCapabilities.xml" -o caps.xml
          python3 -c "
          import re
          s=open('caps.xml').read()
          i=s.index('<ows:Identifier>GHRSST_L4_MUR_Sea_Surface_Temperature</ows:Identifier>')
          a=s.rfind('<Layer>',0,i); b=s.index('</Layer>',i)
          print(s[a:b][:3000])
          "
          for u in https://gibs.earthdata.nasa.gov/colormaps/v1.3/GHRSST_Sea_Surface_Temperature.xml https://gibs.earthdata.nasa.gov/legends/GHRSST_Sea_Surface_Temperature_H.png https://gibs.earthdata.nasa.gov/legends/GHRSST_Sea_Surface_Temperature_H.svg; do echo "== $u"; curl -s -o /tmp/x -w "%{http_code} %{content_type} %{size_download}\n" "$u"; head -c 1500 /tmp/x | strings | head -25; done
