# Temporary: checks USGS imagery transparency over water. Remove after use.
name: Service probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          pip install -q pillow >/dev/null 2>&1
          curl -s -m 40 -o t.png "https://basemap.nationalmap.gov/arcgis/services/USGSImageryOnly/MapServer/WMSServer?service=WMS&request=GetMap&version=1.3.0&layers=0&styles=&format=image/png&transparent=true&crs=EPSG:3857&width=256&height=256&bbox=-13306157.9,4031474.5,-13267022.1,4070118.9"
          python3 -c "
          from PIL import Image; im=Image.open('t.png'); print('T mode', im.mode)
          im=im.convert('RGBA'); px=list(im.getdata()); n=len(px)
          print('T transparent share', sum(1 for p in px if p[3]==0)/n, 'white share', sum(1 for p in px if p[:3]==(255,255,255) and p[3]>0)/n)"
