# Temporary: checks imagery tile sources at each zoom. Remove after use.
name: Service probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          set +e
          while read z x y; do
            a=$(curl -s -m 30 -o /dev/null -w "%{http_code}/%{size_download}" "https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/$z/$y/$x")
            h=$(curl -s -m 30 -o /dev/null -w "%{http_code}/%{size_download}" "https://basemap.nationalmap.gov/arcgis/rest/services/USGSHydroCached/MapServer/tile/$z/$y/$x")
            e=$(curl -s -m 30 -o /dev/null -w "%{http_code}/%{size_download}" "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2023_3857/default/GoogleMapsCompatible/$z/$y/$x.jpg")
            echo "T z$z usgsImg=$a usgsHydro=$h eox=$e"
          done <<'T'
          6 10 25
          7 21 51
          8 43 102
          9 86 204
          10 172 408
          11 345 816
          12 690 1632
          13 1381 3265
          14 2763 6530
          15 5526 13060
          16 11053 26120
          17 22107 52240
          18 44214 104480
          T
          curl -s -m 30 "https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer?f=json" | python3 -c "import json,sys; d=json.load(sys.stdin); ti=d.get('tileInfo',{}); print('T lods', [l['level'] for l in ti.get('lods',[])], 'max', d.get('maxScale'), d.get('copyrightText'))"
