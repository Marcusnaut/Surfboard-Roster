# On-demand helper: pulls surf spots from OpenStreetMap into the `spots-data` branch for review.
name: Build spot list from OpenStreetMap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Query OpenStreetMap
        run: |
          mkdir -p out
          python3 tools/build_spots.py out/spots_osm.json
      - name: Publish to the spots-data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd out
          git init -q -b spots-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spots_osm.json
          git commit -q -m "OSM surf spots $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" spots-data
